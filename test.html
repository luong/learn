const names=["Nhập Xuất","Biến và kiểu dữ liệu","Tính toán","Câu lệnh IF","Vòng lặp","Chuỗi","Danh sách"];
const letters=["A","B","C","D"];
let partIndex=0,order=[],currentOptions=[],pos=0,correctIds=new Set(),wrongIds=new Set(),choice=null,locked=false,reviewMode=false,moveTimer=null;
const el=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function md(s){let tick=String.fromCharCode(96),fence=new RegExp(tick+"{3}(?:python)?\\n?([\\s\\S]*?)"+tick+"{3}","g"),blocks=[],inline=[];let out=esc(s).replace(fence,(_,code)=>{let mark="@@BLOCK"+blocks.length+"@@";blocks.push("<pre><code>"+code.replace(/^\n|\n$/g,"")+"</code></pre>");return mark});out=out.replace(new RegExp(tick+"([^"+tick+"\n]+)"+tick,"g"),(_,code)=>{let mark="@@INLINE"+inline.length+"@@";inline.push("<code>"+code+"</code>");return mark}).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");blocks.forEach((b,i)=>out=out.replace("@@BLOCK"+i+"@@",b));inline.forEach((c,i)=>out=out.replace("@@INLINE"+i+"@@",c));return out}
function buttons(){let box=el("groups");box.innerHTML="";DATA.forEach((part,i)=>{let b=document.createElement("button");b.className="group"+(i===partIndex?" active":"");b.type="button";b.textContent=names[i];b.setAttribute("aria-pressed",i===partIndex);b.onclick=()=>start(i);box.appendChild(b)})}
function start(i){clearTimeout(moveTimer);partIndex=i;order=shuffle(DATA[i].questions.map((_,k)=>k));pos=0;correctIds=new Set();wrongIds=new Set();choice=null;locked=false;reviewMode=false;el("area").classList.remove("hidden");el("finish").classList.remove("show");buttons();render()}
function updateProgress(){let total=DATA[partIndex].questions.length,done=correctIds.size+wrongIds.size;let pct=Math.round(done*100/total);el("progressText").textContent=reviewMode?"Đang làm lại câu sai: "+(pos+1)+" / "+order.length:"Đã trả lời "+done+" / "+total+" câu";el("percent").textContent=pct+"%";el("fill").style.width=pct+"%"}
function render(){if(pos>=order.length){finish();return}let total=DATA[partIndex].questions.length,q=DATA[partIndex].questions[order[pos]];choice=null;locked=false;currentOptions=shuffle(q.options.map((_,i)=>i));el("part").textContent="Phần "+(partIndex+1)+" – "+names[partIndex];el("current").textContent=(pos+1)+" / "+(reviewMode?order.length:total);el("total").textContent=total;el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;updateProgress();el("question").innerHTML=md(q.prompt);el("feedback").className="feedback";el("feedback").innerHTML="";el("check").classList.remove("hidden");el("check").disabled=true;el("next").classList.add("hidden");let box=el("options");box.innerHTML="";currentOptions.forEach((originalIndex,i)=>{let text=q.options[originalIndex],lab=document.createElement("label");lab.className="option";lab.innerHTML='<input type="radio" name="answer" value="'+i+'"><span><b>'+letters[i]+'. </b>'+md(text)+'</span>';lab.querySelector("input").onchange=()=>{if(!locked){choice=i;box.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));lab.classList.add("selected");el("check").disabled=false}};box.appendChild(lab)})}
function nextQuestion(){clearTimeout(moveTimer);pos++;render()}
function check(){if(choice===null||locked)return;locked=true;let questionId=order[pos],q=DATA[partIndex].questions[questionId],correctChoice=currentOptions.indexOf(q.answer),opts=el("options").querySelectorAll(".option");opts.forEach((o,i)=>{o.classList.add("disabled");o.querySelector("input").disabled=true;if(i===correctChoice)o.classList.add("correct");if(i===choice&&choice!==correctChoice)o.classList.add("incorrect")});el("check").classList.add("hidden");let f=el("feedback");if(choice===correctChoice){correctIds.add(questionId);wrongIds.delete(questionId);f.className="feedback show ok";f.textContent="Đúng! Đang chuyển sang câu tiếp theo…";moveTimer=setTimeout(nextQuestion,850)}else{if(!correctIds.has(questionId))wrongIds.add(questionId);f.className="feedback show no";f.innerHTML="Sai. Đáp án đúng là "+letters[correctChoice]+".<small>"+md(q.options[q.answer])+"</small>";el("next").classList.remove("hidden")}el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;updateProgress()}
function finish(){el("area").classList.add("hidden");el("finish").classList.add("show");let total=DATA[partIndex].questions.length;el("current").textContent=total+" / "+total;el("progressText").textContent="Hoàn thành "+total+" / "+total+" câu";el("percent").textContent="100%";el("fill").style.width="100%";el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;el("finishMessage").textContent="Bạn đúng "+correctIds.size+" / "+total+" câu; còn "+wrongIds.size+" câu sai.";if(wrongIds.size===0){el("finishTitle").textContent="Chúc mừng! Bạn đã trả lời đúng tất cả câu hỏi! 🎉";el("reviewPrompt").classList.add("hidden")}else{el("finishTitle").textContent="Bạn đã hoàn thành phần này.";el("reviewPrompt").classList.remove("hidden")}}
function retryWrong(){if(!wrongIds.size){finish();return}clearTimeout(moveTimer);order=shuffle(Array.from(wrongIds));pos=0;reviewMode=true;el("finish").classList.remove("show");el("area").classList.remove("hidden");render()}
function stopReview(){el("reviewPrompt").classList.add("hidden");el("finishMessage").textContent="Kết quả cuối: đúng "+correctIds.size+" / "+DATA[partIndex].questions.length+" câu; còn "+wrongIds.size+" câu sai."}
el("check").onclick=check;el("next").onclick=nextQuestion;el("reviewYes").onclick=retryWrong;el("reviewNo").onclick=stopReview;buttons();start(0);

</script></body></html>
