<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary &amp; Grammar Quiz · Term 1</title>
<style>
:root { color-scheme: light; --ink: #202938; --blue: #345f9c; --line: #dce1e8; --page: #f2f4f8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 18px/1.5 system-ui, sans-serif; }
main { width: min(888px, calc(100% - 28px)); margin: 22px auto 40px; }
h2, p { margin: 0; }
h2 { font-size: clamp(19px, 4vw, 24px); overflow-wrap: anywhere; }
button, input { font: inherit; }
button { border: 1px solid var(--line); border-radius: 11px; background: white; color: inherit; padding: 9px 13px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"], .primary { background: var(--blue); color: white; border-color: var(--blue); }
:focus-visible { outline: 3px solid #427ac1; outline-offset: 3px; }
nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px #3145660a; }
.card-head, .card-body { padding: clamp(15px, 3vw, 22px); }
.card-head { border-bottom: 1px solid var(--line); }
#unit-title { color: var(--blue); font-weight: 750; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.stats div { background: var(--page); border-radius: 10px; padding: 7px 11px; }
.stats span { display: block; color: #515d70; font-size: calc(.83rem + 1px); }
.stats strong { display: block; font-size: calc(1.15rem + 1px); }
#right, #verdict[data-result="correct"] { color: #246735; }
#wrong, #verdict[data-result="wrong"] { color: #992f26; }
#instruction, #ipa { color: #515d70; margin-bottom: 4px; }
#ipa { margin-top: 4px; }
#typed { display: block; width: 100%; margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; color: inherit; }
.options { display: grid; gap: 8px; margin: 16px 0 0; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; }
.option input { margin: 0; accent-color: var(--blue); }
.option:has(input:disabled) { cursor: default; }
#feedback { background: var(--page); border-radius: 10px; margin-top: 14px; padding: 12px 14px; overflow-wrap: anywhere; }
#feedback p, #summary { margin-top: 5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
[hidden] { display: none !important; }
@media (max-width: 440px) {
  nav { gap: 5px; }
  nav button { padding-inline: 1px; font-size: clamp(.62rem, 2.7vw, .88rem); }
}

body{font-size:18px}#prompt{font-size:clamp(19px,4vw,24px)}#instruction,#ipa{font-size:16px}
body{font-size:18px}#prompt{font-size:clamp(19px,4vw,24px)}#instruction,#ipa{font-size:16px}</style>
</head>
<body>
<main>
  <nav id="units" aria-label="Select a test"></nav>
  <section class="card" aria-labelledby="unit-title">
    <div class="card-head">
      <p id="unit-title"></p>
      <div class="stats">
        <div><span>Question</span><strong id="position"></strong></div>
        <div><span>Correct</span><strong id="right"></strong></div>
        <div><span>Wrong</span><strong id="wrong"></strong></div>
      </div>
    </div>
    <div class="card-body">
      <form id="question">
        <p id="instruction"></p>
        <h2 id="prompt" tabindex="-1"></h2>
        <p id="ipa" hidden></p>
        <div id="options" class="options" role="radiogroup" aria-labelledby="instruction prompt" aria-describedby="ipa"></div>
        <input id="typed" type="text" aria-label="Type the word" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer" hidden>
        <div id="feedback" role="status" hidden>
          <strong id="verdict"></strong>
          <p id="details"></p>
          <p id="definition"></p>
          <p id="example" hidden></p>
        </div>
        <div class="actions">
          <button id="check" type="submit" class="primary" disabled>Check answer</button>
          <button id="next" type="submit" class="primary" hidden disabled>Next</button>
        </div>
      </form>
      <div id="finish" hidden>
        <h2 id="finish-title" tabindex="-1">Test complete</h2>
        <p id="summary"></p>
        <div class="actions">
          <button id="retry" type="button" class="primary">Retry wrong answers</button>
          
        </div>
      </div>
    </div>
  </section>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
const entries = JSON.parse($('vocabulary').textContent);
const grammar = JSON.parse($('grammar').textContent);
const vocabularyIds = entries.map((_, id) => id);
const tests = [
  { name: 'VOCAB 1', vocabularyIds: vocabularyIds.slice(0, 25) },
  { name: 'VOCAB 2', vocabularyIds: vocabularyIds.slice(25) },
  ...grammar.map((questions, index) => ({ name: 'GRAMMAR ' + (index + 1), type: 'grammar', questions })),
];
const letters = 'ABCD';
const overlapping = ['population', 'community'];
let run;
let unit = 0;

function wordWithPart(entry) {
  const part = entry.part
    .replace(/\badjective\b/g, 'adj')
    .replace(/\badverb\b/g, 'adv')
    .replace(/\bnoun\b/g, 'n')
    .replace(/\bverb\b/g, 'v')
    .replace(/,? \(?(plural|past|passive)\)?/g, ' $1');
  return entry.word + ' (' + part.replace(', ', '/') + ')';
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swap]] = [copy[swap], copy[index]];
  }
  return copy;
}

const normalizeWord = value => value.normalize('NFC').trim().toLowerCase()
  .replace(/[’‘]/g, "'").replace(/\s+/g, ' ');

function buildQuestion(id, type) {
  if (type === 'word') return { id, type, options: [] };
  if (tests[unit].questions) return { id, type, correctId: 0, options: shuffle([0, 1, 2, 3]) };
  const word = entries[id].word;
  const candidates = tests[unit].vocabularyIds.filter(index => {
    const other = entries[index].word;
    return index !== id && !(overlapping.includes(word) && overlapping.includes(other));
  });
  return { id, type, correctId: id, options: shuffle([id, ...shuffle(candidates).slice(0, 3)]) };
}


function entryDifficulty(entry,type){
 if(type==='word'||type==='definition'){
  const word=entry.word||'';const abstract=/tion$|ment$|ness$|ity$|ism$|ence$|ance$/.test(word);
  return (type==='word'?100:0)+(word.includes(' ')?20:0)+(abstract?10:0)+Math.max(0,word.replace(/[^a-z]/gi,'').length-5);
 }
 const t=(entry.explanation+' '+entry.prompt).toLowerCase();let level=10;
 if(/past|future|comparative|superlative|gerund|infinitive|followed by|-ing form/.test(t))level=20;
 if(/perfect|passive|relative|conditional|reported|wish|regret|remember|stop|try /.test(t))level=30;
 if(/mixed|inversion|third conditional|perfect continuous|would have|had been/.test(t))level=40;

}

function start(missed = null) {
  const test = tests[unit];
  const items = test.vocabularyIds
    ? ['definition', 'word'].flatMap(type => shuffle(test.vocabularyIds).map(id => ({ id, type })))
    : shuffle(test.questions.map((_, id) => id)).map(id => ({ id, type: test.type }));
  const review = missed && [
    ...shuffle(missed.filter(q => q.type !== 'word')),
    ...shuffle(missed.filter(q => q.type === 'word')),
  ];
  const questions = (review ?? items).sort((a,b)=>entryDifficulty((test.questions??entries)[a.id],a.type)-entryDifficulty((test.questions??entries)[b.id],b.type)).map(({ id, type }) => buildQuestion(id, type));
  run = {
    questions,
    index: 0, selected: null, checked: false, correct: 0, missed: [], review: missed !== null,
  };
}

function render(focus = false) {
  const question = run.questions[run.index];
  const test = tests[unit];
  const isGrammar = test.type === 'grammar';
  const entry = question && (test.questions ?? entries)[question.id];
  const total = run.questions.length;
  $('unit-title').textContent = test.name + (run.review ? ' · Review' : '');

  $('question').hidden = !question;

  const showWord = question.type === 'definition';
  const typing = question.type === 'word';
  $('instruction').textContent = isGrammar ? 'Choose the correct answer.' : showWord ? 'Choose the correct definition.' : 'Type the word or phrase.';
  $('prompt').textContent = isGrammar ? entry.prompt : showWord ? wordWithPart(entry) : entry.definition;
  $('ipa').textContent = showWord ? entry.ipa : '';
  $('ipa').hidden = !showWord;
  $('options').hidden = typing;
  $('typed').hidden = !typing;
  $('typed').value = typing ? run.selected ?? '' : '';
  $('typed').disabled = !typing || run.checked;
  $('options').replaceChildren();
  question.options.forEach((id, index) => {
    const label = document.createElement('label');
    label.className = 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'choice';
    radio.checked = run.selected === id;
    radio.disabled = run.checked;
    radio.addEventListener('change', () => {
      run.selected = id;
      $('check').disabled = false;
    });
    const text = document.createElement('span');
    const choice = entries[id];
    const answer = isGrammar ? entry.choices[id] : showWord ? choice.definition : wordWithPart(choice);
    text.textContent = letters[index] + '. ' + answer;
    label.append(radio, text);
    $('options').append(label);
  });

  $('feedback').hidden = !run.checked;
  if (run.checked) {
    const correct = isCorrect(question);
    const correctLetter = letters[question.options.indexOf(question.correctId)];
    $('verdict').textContent = correct ? 'CORRECT' : typing ? 'WRONG.' : 'WRONG. It is ' + correctLetter + '.';
    $('verdict').dataset.result = correct ? 'correct' : 'wrong';
    $('details').textContent = isGrammar ? entry.prompt.replace('___', entry.choices[question.correctId]) : wordWithPart(entry) + (entry.ipa ? ' · ' + entry.ipa : '');
    $('definition').textContent = isGrammar ? entry.explanation : 'Definition: ' + entry.definition;
    $('example').hidden = !entry.example?.trim();
    $('example').textContent = $('example').hidden ? '' : 'Example: ' + entry.example;
  }

  $('check').hidden = run.checked;
  $('check').disabled = run.checked || run.selected === null;
  $('next').textContent = run.index === total - 1 ? 'See results'
    : showWord && run.questions[run.index + 1].type === 'word' ? 'Start typing answers' : 'Next';
  $('next').hidden = !run.checked;
  $('next').disabled = !run.checked;
  if (focus) (run.checked ? $('next') : typing ? $('typed') : $('prompt')).focus();
}

function isCorrect(question) {
  if (question.type !== 'word') return run.selected === question.correctId;
  return normalizeWord(run.selected) === normalizeWord(entries[question.id].word);
}

$('typed').addEventListener('input', () => {
  if (run.checked) return;
  const value = $('typed').value;
  run.selected = normalizeWord(value) ? value : null;
  $('check').disabled = run.selected === null;
});

$('question').addEventListener('submit', event => {
  event.preventDefault();
  const question = run.questions[run.index];
  if (!question || run.selected === null) return;
  if (run.checked) {
    run.index++;
    run.selected = null;
    run.checked = false;
  } else {
    run.checked = true;
    if (isCorrect(question)) run.correct++;
    else run.missed.push(question);
  }
  render(true);
});

$('retry').addEventListener('click', () => {
  const missed = run.missed;
  if (!missed.length) return;
  start(missed);
  render(true);
});



tests.forEach((test, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = test.name;
  button.addEventListener('click', () => {
    if (index === unit) return;
    unit = index;
    start();
    render(true);
  });
  $('units').append(button);
});

start();
render();

</script>
<script>
// Persist each test independently, including unfinished answers.
(()=>{
 const key='quiz-progress-v2:'+location.pathname;
 let store;try{store=JSON.parse(localStorage.getItem(key))||{tests:{}}}catch{store={tests:{}}}
 let restoring=false,active=null;
 const signature=value=>{let h=2166136261;for(const c of JSON.stringify(value))h=Math.imul(h^c.charCodeAt(0),16777619);return String(h>>>0)};
 
 const index=()=>unit,count=()=>tests.length,sig=()=>signature(tests[unit]),isReview=args=>args[0]!=null,clearTimer=()=>{};
 const capture=()=>JSON.parse(JSON.stringify(run));
 function restore(v){run=v;render()}
 const fresh=()=>{start();render()};
 const initial=i=>{unit=i;start();render()};

 function save(){if(restoring||active===null)return;try{store.tests[active]={signature:sig(),state:capture()};store.last=index();localStorage.setItem(key,JSON.stringify(store))}catch{}}
 const originalStart=start;
 start=function(...args){
  if(active===String(index()))save();const review=isReview(args);restoring=true;try{originalStart(...args)}finally{restoring=false}active=String(index());
  const saved=store.tests[active];
  if(!review&&saved&&saved.signature===sig()){
   restoring=true;try{restore(saved.state)}catch{delete store.tests[active]}finally{restoring=false}
  }
  save();
 };
 const originalRender=render;
 render=function(...args){const result=originalRender(...args);save();return result};
 const reset=document.createElement('button');reset.type='button';reset.textContent='Làm lại';reset.className='action';reset.id='resetTest';reset.style.cssText='display:block;margin:16px auto';
 reset.onclick=()=>{if(!confirm('Làm lại bài test này? Tiến độ và kết quả đã lưu của bài này sẽ bị xóa.'))return;clearTimer();delete store.tests[String(index())];active=null;fresh();active=String(index());save()};
 document.querySelector('main').append(reset);
 document.addEventListener('click',save,true);
 for(const event of ['input','change','click','submit'])document.addEventListener(event,()=>queueMicrotask(save));
 window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
 const target=Number.isInteger(store.last)&&store.last>=0&&store.last<count()?store.last:index();
 active=null;initial(target);active=String(index());save();
})();
</script><script>
(()=>{
 let armed=null;
 const current=()=>run;
 const token=()=>unit+':'+current().index;
 function selectCorrect(){const r=current(),q=r.questions[r.index];if(!q)return;
  r.selected=q.type==='word'?entries[q.id].word:q.correctId;r.checked=false;render();
 }
 document.getElementById('right').parentElement.addEventListener('click',()=>{
  const r=current();if(r.index>=r.questions.length)return;
  if(armed===token()){selectCorrect();r.index++;r.selected=null;r.checked=false;render();armed=null}
  else{selectCorrect();armed=token()}
 });
 document.getElementById('wrong').parentElement.addEventListener('click',()=>{const r=current();if(r.index<=0)return;r.index--;r.selected=null;r.checked=false;armed=null;render()});
})();
</script></body>
