<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary &amp; Grammar Quiz · Term 1</title>
<style>
:root { color-scheme: light; --ink: #202938; --blue: #345f9c; --line: #dce1e8; --page: #f2f4f8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
main { width: min(888px, calc(100% - 28px)); margin: 22px auto 40px; }
h2, p { margin: 0; }
h2 { font-size: clamp(19px, 4vw, 24px); overflow-wrap: anywhere; }
button, input { font: inherit; }
button { border: 1px solid var(--line); border-radius: 11px; background: white; color: inherit; padding: 9px 13px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"], .primary { background: var(--blue); color: white; border-color: var(--blue); }
:focus-visible { outline: 3px solid #427ac1; outline-offset: 3px; }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px #3145660a; }
.card-head, .card-body { padding: clamp(15px, 3vw, 22px); }
.card-head { border-bottom: 1px solid var(--line); }
#unit-title { color: var(--blue); font-weight: 750; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.stats div { background: var(--page); border-radius: 10px; padding: 7px 11px; }
.stats span { display: block; color: #515d70; font-size: .83rem; }
.stats strong { display: block; font-size: 1.15rem; }
#right, #verdict[data-result="correct"] { color: #246735; }
#wrong, #verdict[data-result="wrong"] { color: #992f26; }
#instruction, #ipa { color: #515d70; margin-bottom: 4px; }
#ipa { margin-top: 4px; }
.options { display: grid; gap: 8px; margin: 16px 0 0; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; }
.option input { margin: 0; accent-color: var(--blue); }
.option:has(input:disabled) { cursor: default; }
#feedback { background: var(--page); border-radius: 10px; margin-top: 14px; padding: 12px 14px; overflow-wrap: anywhere; }
#feedback p, #summary { margin-top: 5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
[hidden] { display: none !important; }
@media (max-width: 440px) {
  nav { gap: 5px; }
  nav button { padding-inline: 1px; font-size: clamp(.62rem, 2.7vw, .88rem); }
}
</style>
</head>
<body>
<main>
  <nav id="units" aria-label="Select a test"></nav>
  <section class="card" aria-labelledby="unit-title">
    <div class="card-head">
      <p id="unit-title"></p>
      <div class="stats">
        <div><span>Question</span><strong id="position"></strong></div>
        <div><span>Correct</span><strong id="right"></strong></div>
        <div><span>Wrong</span><strong id="wrong"></strong></div>
      </div>
    </div>
    <div class="card-body">
      <form id="question">
        <p id="instruction"></p>
        <h2 id="prompt" tabindex="-1"></h2>
        <p id="ipa" hidden></p>
        <div id="options" class="options" role="radiogroup" aria-labelledby="instruction prompt" aria-describedby="ipa"></div>
        <div id="feedback" role="status" hidden>
          <strong id="verdict"></strong>
          <p id="details"></p>
          <p id="definition"></p>
          <p id="example" hidden></p>
        </div>
        <div class="actions">
          <button id="check" type="submit" class="primary" disabled>Check answer</button>
          <button id="next" type="submit" class="primary" hidden disabled>Next</button>
        </div>
      </form>
      <div id="finish" hidden>
        <h2 id="finish-title" tabindex="-1">Test complete</h2>
        <p id="summary"></p>
        <div class="actions">
          <button id="retry" type="button" class="primary">Retry wrong answers</button>
          <button id="restart" type="button">Restart full test</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script id="grammar" type="application/json">[[{"prompt": "She admitted ___ on the test.", "choices": ["cheating", "to cheat", "cheat", "cheated"], "explanation": "Admit is followed by the -ing form."}, {"prompt": "I try to avoid ___ junk food.", "choices": ["eating", "to eat", "eat", "ate"], "explanation": "Avoid is followed by the -ing form."}, {"prompt": "He kept on ___ even after the meeting ended.", "choices": ["talking", "to talk", "talk", "talked"], "explanation": "Keep on is followed by the -ing form."}, {"prompt": "They postponed ___ on holiday until next month.", "choices": ["going", "to go", "go", "went"], "explanation": "Postpone is followed by the -ing form."}, {"prompt": "I suggest ___ earlier to discuss the project.", "choices": ["meeting", "to meet", "meet", "met"], "explanation": "Suggest is followed by the -ing form."}, {"prompt": "They agreed ___ at the café at 5 p.m.", "choices": ["to meet", "meeting", "meet", "met"], "explanation": "Agree is followed by the to-infinitive."}, {"prompt": "She decided ___ abroad next year.", "choices": ["to study", "studying", "study", "studied"], "explanation": "Decide is followed by the to-infinitive."}, {"prompt": "He managed ___ the project on time.", "choices": ["to finish", "finishing", "finish", "finished"], "explanation": "Manage is followed by the to-infinitive."}, {"prompt": "The guide offered ___ us around the city.", "choices": ["to show", "showing", "show", "showed"], "explanation": "Offer is followed by the to-infinitive."}, {"prompt": "My mum didn’t want me ___ the exam.", "choices": ["to take", "taking", "take", "took"], "explanation": "Want can be followed by an object and a to-infinitive."}, {"prompt": "My parents let me ___ out late on weekends.", "choices": ["stay", "to stay", "stayed", "staying"], "explanation": "Let takes an object followed by a bare infinitive."}, {"prompt": "The funny video made everyone ___.", "choices": ["laugh", "to laugh", "laughed", "laughing"], "explanation": "Active make takes an object followed by a bare infinitive."}, {"prompt": "I was made ___ in the corner.", "choices": ["to stand", "stand", "standing", "stood"], "explanation": "Passive make takes the to-infinitive."}, {"prompt": "Which wording shows I heard the whole action, from start to finish?", "choices": ["I heard Miss Jenkins tell Julie not to do that.", "I heard Miss Jenkins telling Julie not to do that.", "I heard Miss Jenkins to tell Julie not to do that.", "I heard Miss Jenkins told Julie not to do that."], "explanation": "The bare infinitive tell presents the action as a whole."}, {"prompt": "Which verb takes either form with little or no change in meaning?", "choices": ["continue", "remember", "stop", "regret"], "explanation": "The sheet gives continued to do and continued doing as equivalent in its example."}, {"prompt": "“I remembered to give her the message.” What happened first?", "choices": ["I remembered the task.", "I gave her the message.", "I forgot the message.", "I forgot giving her the message."], "explanation": "Remember + to-infinitive means remembering a task before doing it."}, {"prompt": "“I couldn’t open the door so I tried using a different key.” What does “tried using” express?", "choices": ["Testing a possible solution.", "Remembering a past action.", "Continuing the same action.", "Giving up the attempt."], "explanation": "Try + -ing describes an experiment or a possible solution."}, {"prompt": "“We stopped to have a cup of tea.” What does “to have” express?", "choices": ["The purpose of stopping.", "The activity we stopped doing.", "An action we regretted.", "An action we forgot to do."], "explanation": "Stop + to-infinitive introduces the purpose of stopping."}, {"prompt": "“We went on talking all night.” What does “went on talking” mean?", "choices": ["We continued talking.", "We stopped talking.", "We moved on to a different activity.", "We forgot to talk."], "explanation": "Go on + -ing means continuing the same action."}, {"prompt": "“The car needs cleaning.” Which meaning matches?", "choices": ["Someone needs to clean the car.", "The car needs to clean something.", "Someone has already cleaned the car.", "The car must stop cleaning."], "explanation": "Need + -ing has a passive meaning in this sentence."}], [{"prompt": "How many main positions for adverbs in a clause does the sheet list?", "choices": ["Three", "One", "Two", "Four"], "explanation": "The positions are at the beginning, at the end and with the verb."}, {"prompt": "Which sentence keeps the verb and its direct object together?", "choices": ["They built the house very quickly.", "They built very quickly the house.", "They built the very quickly house.", "They built the house very quick."], "explanation": "The manner phrase comes after the direct object here."}, {"prompt": "In “The house has always been popular with tourists,” where is “always”?", "choices": ["After the first auxiliary.", "Before the subject.", "After the main adjective.", "Before the first auxiliary."], "explanation": "With auxiliary verbs, the normal position here is after has."}, {"prompt": "What is the first auxiliary in “Our house will probably have been decorated by the time you get there”?", "choices": ["will", "have", "been", "decorated"], "explanation": "Probably follows will, the first auxiliary."}, {"prompt": "“I’m rarely in the city centre.” Where is “rarely”?", "choices": ["After a form of be.", "Before a form of be.", "Before the subject.", "After the place phrase."], "explanation": "Frequency adverbs follow be in this pattern."}, {"prompt": "“I rarely go to the city centre.” Where is “rarely”?", "choices": ["Before the main verb.", "After the main verb.", "At the end of the clause.", "After the place phrase."], "explanation": "Frequency adverbs typically come before ordinary main verbs."}, {"prompt": "“We bought it as an investment; then, all the property prices in the area fell.” Which word connects the clauses?", "choices": ["then", "all", "area", "fell"], "explanation": "Then is a connecting adverb at the beginning of the second clause."}, {"prompt": "What type of adverb is “carefully” in the glass example?", "choices": ["Manner", "Place", "Time", "Frequency"], "explanation": "Carefully describes how to pick the glass up."}, {"prompt": "What type of adverb is “abroad” in “They’re staying abroad”?", "choices": ["Place", "Degree", "Manner", "Frequency"], "explanation": "Abroad describes where they are staying."}, {"prompt": "What type of adverbial is “on Saturday” in “I’ll see you on Saturday”?", "choices": ["Time", "Place", "Degree", "Manner"], "explanation": "On Saturday describes when the meeting will happen."}, {"prompt": "What type of adverb is “often” in “I often meet him in the park”?", "choices": ["Frequency", "Degree", "Place", "Manner"], "explanation": "Often tells how frequently the speaker meets him."}, {"prompt": "What type of adverb is “quite” in “I quite like that dress”?", "choices": ["Degree", "Time", "Frequency", "Place"], "explanation": "Quite modifies the degree of liking."}, {"prompt": "What type of adverb is “hopefully” in “Hopefully, I’ll be there before 10 o’clock”?", "choices": ["Sentence adverb", "Adverb of place", "Adverb of manner", "Adverb of frequency"], "explanation": "Hopefully expresses the speaker’s attitude toward the whole statement."}, {"prompt": "Which expression does the sheet list as an adverbial of manner?", "choices": ["in a friendly way", "downstairs", "twice a week", "for a long time"], "explanation": "In a friendly way describes how an action is done."}, {"prompt": "Which expression does the sheet list under location or direction?", "choices": ["over here", "very much", "again", "eventually"], "explanation": "Over here indicates a location."}, {"prompt": "Which expression tells how frequently something happens?", "choices": ["twice a week", "on Saturday", "underneath", "badly"], "explanation": "Twice a week describes frequency."}, {"prompt": "Which word from the sheet can express certainty about a whole statement?", "choices": ["definitely", "downstairs", "monthly", "carefully"], "explanation": "Definitely expresses the speaker’s certainty."}, {"prompt": "In “Sandstone is not a very hard material,” what is “hard”?", "choices": ["An adjective describing material.", "An adverb of frequency.", "An adverb modifying hear.", "A connecting adverb."], "explanation": "Hard describes the noun material."}, {"prompt": "Hit it too ___ and you’ll break it.", "choices": ["hard", "hardly", "hardness", "harden"], "explanation": "Hard means with force here and modifies hit."}, {"prompt": "I could ___ hear the music.", "choices": ["hardly", "hard", "hardness", "harden"], "explanation": "Hardly means almost not here."}], [{"prompt": "Which linker introduces the first point in a sequence?", "choices": ["Firstly", "Finally", "Consequently", "However"], "explanation": "Firstly opens a sequence."}, {"prompt": "Which linker explicitly introduces point number two?", "choices": ["Secondly", "First of all", "Finally", "To sum up"], "explanation": "Secondly introduces the second point."}, {"prompt": "Which linker adds extra information?", "choices": ["In addition", "Unlike", "Therefore", "Although"], "explanation": "In addition introduces a further point."}, {"prompt": "Which linker is listed as an informal way to add information?", "choices": ["What’s more", "Moreover", "Additionally", "Hence"], "explanation": "The sheet identifies What’s more as informal and moreover and additionally as formal."}, {"prompt": "Which linker introduces the last step in a sequence?", "choices": ["Finally", "Firstly", "Because", "Whereas"], "explanation": "Finally introduces the last point or step."}, {"prompt": "Which linker signals a summary of the main points?", "choices": ["To sum up", "Owing to", "Nevertheless", "Next"], "explanation": "To sum up signals a summary."}, {"prompt": "“We stayed inside because it was raining.” Which part gives the reason?", "choices": ["it was raining", "we stayed inside", "we stayed", "inside"], "explanation": "Because introduces the clause that gives the reason."}, {"prompt": "Which group can introduce a clause giving a reason?", "choices": ["Because / Since / As", "Due to / Owing to", "Therefore / Consequently", "However / Nevertheless"], "explanation": "Because, since and as can introduce a reason clause."}, {"prompt": "Which pair can introduce a noun phrase giving the reason?", "choices": ["Due to / Owing to", "Because / Since", "Therefore / Hence", "Although / Though"], "explanation": "Due to and owing to can be followed by a noun phrase."}, {"prompt": "“The shop was closed; therefore, we went to another one.” What does “therefore” signal?", "choices": ["A result", "A reason clause", "A contrast", "The first point"], "explanation": "Therefore introduces the result of the shop being closed."}, {"prompt": "Which group consists entirely of result linkers from the sheet?", "choices": ["As a result / Consequently / For this reason", "Since / However / Finally", "Because / Next / Unlike", "Nevertheless / Whereas / Owing to"], "explanation": "All three correct options in the group can introduce a result."}, {"prompt": "“He was the oldest, hence the leader of the group.” What follows “hence” here?", "choices": ["A noun phrase", "A complete clause", "A bare infinitive", "A question"], "explanation": "The leader of the group is a noun phrase."}, {"prompt": "“It was raining; however, we still went hiking.” What does “however” signal?", "choices": ["A contrast between ideas", "The reason it rained", "The result of hiking", "The first step in a sequence"], "explanation": "However contrasts the rain with the decision to go hiking."}, {"prompt": "Which group is listed with “however” for contrasting statements?", "choices": ["Nevertheless / Nonetheless / Even so", "Because / Since / As", "Firstly / Secondly / Next", "Due to / Owing to / Hence"], "explanation": "Nevertheless, nonetheless and even so can contrast ideas."}, {"prompt": "___ it was late, we kept talking.", "choices": ["Although", "Due to", "In addition", "Therefore"], "explanation": "Although introduces a contrasting clause."}, {"prompt": "In “Although it was late, we kept talking,” which words form the clause introduced by “although”?", "choices": ["it was late", "we kept talking", "late", "talking"], "explanation": "The clause has a subject, it, and a verb, was."}, {"prompt": "“She is an introverted girl. In contrast, her brother is very outgoing.” What does “in contrast” do?", "choices": ["Points out a difference between the two people.", "Gives a reason why she is introverted.", "Lists events in order.", "Summarises the story."], "explanation": "In contrast introduces a clear difference."}, {"prompt": "He likes coffee, ___ I prefer tea.", "choices": ["whereas", "due to", "on the other hand", "in comparison with"], "explanation": "Whereas joins the two contrasting clauses in this sentence."}, {"prompt": "___ my sister, I enjoy outdoor activities.", "choices": ["Unlike", "Although", "However", "Therefore"], "explanation": "Unlike introduces the noun phrase my sister."}, {"prompt": "Which pair can introduce a noun phrase when comparing two subjects?", "choices": ["In comparison with / Compared to", "Although / Though", "Therefore / Consequently", "Firstly / Secondly"], "explanation": "In comparison with and compared to can introduce noun phrases for comparison."}], [{"prompt": "Which formula gives the basic passive structure?", "choices": ["Subject + be + past participle + optional by-phrase", "Subject + be + bare infinitive + optional by-phrase", "Subject + be + to-infinitive + direct object", "Subject + past participle + be"], "explanation": "The basic passive uses a form of be and a past participle."}, {"prompt": "Which is the past simple passive of “Cambridge University Press published this book”?", "choices": ["This book was published by Cambridge University Press.", "This book is published by Cambridge University Press.", "This book was publishing by Cambridge University Press.", "This book has published Cambridge University Press."], "explanation": "Use was published to keep the past simple and make the book the subject."}, {"prompt": "Which forms of be are used for the past simple passive?", "choices": ["was / were", "am / is / are", "am being / is being / are being", "has / have"], "explanation": "The past simple passive uses was or were before the past participle."}, {"prompt": "Which forms of be are used for the present continuous passive?", "choices": ["am being / is being / are being", "was / were", "am / is / are", "has been / have been"], "explanation": "The present continuous passive uses am, is or are plus being before the past participle."}, {"prompt": "“The car was stolen at approximately 1.30 am.” What reason for using the passive does the sheet illustrate?", "choices": ["The person who stole it is unknown.", "The action has not happened.", "The car performed the action.", "The verb cannot have an object."], "explanation": "The passive can describe an action without naming an unknown agent."}, {"prompt": "Which example illustrates using the passive for a formal style?", "choices": ["All passengers are required to present their ticket to the inspector.", "The car was stolen at approximately 1.30 am.", "Did you get Alex to drive you all the way to London?", "Cambridge University Press published this book."], "explanation": "The sheet uses the passenger requirement to illustrate formal style."}, {"prompt": "Which verb is listed as intransitive and generally unsuitable for the passive?", "choices": ["arrive", "publish", "design", "require"], "explanation": "Arrive is listed as intransitive."}, {"prompt": "Which verb is listed as generally unsuitable for the passive when used statively?", "choices": ["resemble", "steal", "publish", "introduce"], "explanation": "The sheet lists stative resemble among the verbs not usually used in the passive."}, {"prompt": "Whi ion": "Have + object + past participle can describe an unwanted experience."}, {"prompt": "Did you get Alex ___ you all the way to London?", "choices": ["to drive", "drive", "drove", "to driving"], "explanation": "Get + person + to-infinitive describes getting someone to do something."}, {"prompt": "Which form follows the person in the pattern “have somebody do something”?", "choices": ["A bare infinitive", "A to-infinitive", "A past participle", "A that-clause"], "explanation": "Have somebody do something uses the infinitive without to."}, {"prompt": "Don’t worry. We’ll soon have your car ___ like new.", "choices": ["running", "to running", "ran", "to ran"], "explanation": "This example uses have + object + -ing to describe making something start doing something."}, {"prompt": "Which pair of patterns describes getting somebody to perform an action for you?", "choices": ["get somebody to do / have somebody do", "get somebody do / have somebody to do", "get to do somebody / have do somebody", "get somebody that does / have somebody that does"], "explanation": "Get takes to do in this pattern and have takes the bare infinitive."}, {"prompt": "Which construction can express making somebody or something start doing an activity?", "choices": ["get/have + object + -ing", "get/have + -ing + object", "get/have + object + that-clause", "get/have + object + finite past verb"], "explanation": "Get or have somebody doing describes making an action start."}], [{"prompt": "Which punctuation joins the parts of “well-known” in “a well-known neighborhood”?", "choices": ["A hyphen", "An apostrophe", "A comma", "A slash"], "explanation": "A hyphen joins well and known in this compound adjective."}, {"prompt": "Which compound adjective modifies “hotel” in the sheet’s example?", "choices": ["five-star", "full-time", "second-hand", "well-known"], "explanation": "The example in the sheet is “We stayed in a five-star hotel.”"}, {"prompt": "In “He bought a second-hand car,” what does “second-hand” describe?", "choices": ["The car", "The buyer", "The action of buying", "The time of buying"], "explanation": "The compound adjective second-hand modifies car."}, {"prompt": "What pattern does the sheet give for “left-handed”?", "choices": ["Adjective + noun + -ed", "Noun + adjective", "Number + noun", "Adverb + past participle"], "explanation": "Left-handed combines left and hand with -ed."}, {"prompt": "Which example follows the noun + adjective pattern?", "choices": ["sky-blue", "five-star", "good-looking", "well-known"], "explanation": "Sky is a noun and blue is an adjective."}, {"prompt": "Which example follows the adjective + present participle pattern?", "choices": ["good-looking", "sky-blue", "three-day", "badly-behaved"], "explanation": "Good is an adjective and looking is a present participle."}, {"prompt": "Which example follows the adverb + past participle pattern?", "choices": ["badly-behaved", "easy-going", "world-famous", "five-star"], "explanation": "Badly is an adverb and behaved is a past participle."}, {"prompt": "Which example follows the number + noun pattern?", "choices": ["three-day", "left-handed", "good-looking", "second-hand"], "explanation": "Three is a cardinal number and day is a noun in the pattern listed."}, {"prompt": "What is the main role of the compound adjectives in the sheet’s examples?", "choices": ["To describe a noun concisely.", "To join two complete clauses.", "To form a continuous tense.", "To show how frequently an action happens."], "explanation": "Compound adjectives combine words to describe a noun."}, {"prompt": "Which compound adjective does the sheet list with “decision-making” under “Other combinations”?", "choices": ["cross-country", "old-fashioned", "well-known", "world-famous"], "explanation": "The sheet groups decision-making and cross-country under other combinations."}, {"prompt": "What is the -ing form of “play” given in the sheet?", "choices": ["playing", "played", "plays", "play"], "explanation": "The sheet shows play → playing."}, {"prompt": "“She is reading a book.” What is the role of “reading”?", "choices": ["Present participle in a continuous tense.", "Gerund as subject.", "Adjective modifying book.", "Past participle in a passive construction."], "explanation": "Is reading is a continuous verb form."}, {"prompt": "“This is an interesting film.” Which noun does “interesting” describe?", "choices": ["film", "this", "is", "an"], "explanation": "Interesting is an adjective modifying film."}, {"prompt": "“Swimming is my favorite sport.” What is the role of “Swimming”?", "choices": ["Gerund used as the subject.", "Part of a continuous tense.", "Adjective modifying sport.", "Adverb of manner."], "explanation": "Swimming names an activity and functions as the subject."}, {"prompt": "“He enjoys painting.” What is the role of “painting”?", "choices": ["Gerund used as the object of enjoys.", "Adjective describing he.", "Part of a continuous tense.", "Past participle after an auxiliary."], "explanation": "Painting names the activity that he enjoys."}, {"prompt": "Which sentence uses an -ing form as part of a continuous tense?", "choices": ["She is reading a book.", "Swimming is my favorite sport.", "He enjoys painting.", "The lecture was boring."], "explanation": "Is reading combines be with a present participle to express a continuous action."}, {"prompt": "Which sentence uses an -ing form as an adjective before a noun?", "choices": ["It’s a shocking story.", "She is reading a book.", "He enjoys painting.", "Swimming is my favorite sport."], "explanation": "Shocking comes before and describes story."}, {"prompt": "“The lecture was boring.” What does “boring” describe here?", "choices": ["The lecture as the cause of a feeling.", "A listener experiencing the feeling.", "An action in progress.", "A hobby used as the subject."], "explanation": "The -ing adjective describes what causes the feeling."}, {"prompt": "“It’s a shocking story.” What causes the feeling in this example?", "choices": ["The story", "The person hearing it", "The verb is", "The adjective ending by itself"], "explanation": "Shocking describes the story as the cause of the feeling."}, {"prompt": "Which statement defines a gerund as taught in the sheet?", "choices": ["It is an -ing verb form used as a noun.", "It is an -ing form used only in continuous tenses.", "It is a past participle used after be.", "It is a compound adjective joined by a hyphen."], "explanation": "A gerund is an -ing form functioning as a noun."}]]</script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const units = JSON.parse($('vocabulary').textContent);
const grammar = JSON.parse($('grammar').textContent);
const tests = [
  ...units.map((entries, index) => ({ name: 'VOCAB ' + (index + 1), entries })),
  ...grammar.map((entries, index) => ({ name: 'GRAMMAR ' + (index + 1), entries })),
];
const sessions = [];
const letters = 'ABCD';
const types = ['definition', 'word'];
// Keep closely related entries from appearing as competing answers.
const similar = [
  [], [['apparently', 'supposedly']],
  [['ridiculously expensive', 'overpriced'], ['fooled', 'fooled into']],
  [['pothole', 'potholed']],
  [['Amazing', 'Spectacular', 'Dramatic', 'Stunning', 'Breathtaking']],
];
let unit = 0;

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swap]] = [copy[swap], copy[index]];
  }
  return copy;
}

function buildQuestion(unitIndex, id, type) {
  if (type === 'grammar') {
    return { id, type, correctId: 0, options: shuffle([0, 1, 2, 3]) };
  }
  const entries = units[unitIndex];
  const word = entries[id].word;
  const related = similar[unitIndex].find(group => group.includes(word)) || [];
  const candidates = entries.map((_, index) => index)
    .filter(index => index !== id && !related.includes(entries[index].word));
  return { id, type, correctId: id, options: shuffle([id, ...shuffle(candidates).slice(0, 3)]) };
}

function start(unitIndex, missed = null) {
  const questionTypes = unitIndex < units.length ? types : ['grammar'];
  const items = missed ?? tests[unitIndex].entries.flatMap((_, id) => questionTypes.map(type => ({ id, type })));
  sessions[unitIndex] = {
    questions: shuffle(items).map(({ id, type }) => buildQuestion(unitIndex, id, type)),
    index: 0, selected: null, checked: false, correct: 0, missed: [], review: missed !== null,
  };
}

function render(focus = false) {
  const run = sessions[unit];
  const question = run.questions[run.index];
  const test = tests[unit];
  const entry = question && test.entries[question.id];
  const total = run.questions.length;
  $('unit-title').textContent = test.name + (run.review ? ' · Review' : '');
  [...$('units').children].forEach((button, index) => button.setAttribute('aria-pressed', index === unit));
  $('position').textContent = Math.min(run.index + 1, total) + ' / ' + total;
  $('right').textContent = run.correct;
  $('wrong').textContent = run.missed.length;
  $('question').hidden = !question;
  $('finish').hidden = Boolean(question);
  if (!question) {
    $('summary').textContent = run.correct + ' of ' + total + ' correct (' + Math.round(100 * run.correct / total) + '%).';
    $('retry').hidden = run.missed.length === 0;
    $('retry').textContent = 'Retry wrong answers (' + run.missed.length + ')';
    if (focus) $('finish-title').focus();
    return;
  }

  const isGrammar = question.type === 'grammar';
  const showWord = question.type === 'definition';
  $('instruction').textContent = isGrammar ? 'Choose the correct answer.' : showWord ? 'Choose the correct definition.' : 'Choose the correct word.';
  $('prompt').textContent = isGrammar ? entry.prompt : showWord ? entry.word : entry.definition;
  $('ipa').textContent = showWord ? entry.ipa : '';
  $('ipa').hidden = !showWord;
  $('options').replaceChildren();
  question.options.forEach((id, index) => {
    const label = document.createElement('label');
    label.className = 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'choice';
    radio.checked = run.selected === id;
    radio.disabled = run.checked;
    radio.addEventListener('change', () => {
      run.selected = id;
      $('check').disabled = false;
    });
    const text = document.createElement('span');
    text.textContent = letters[index] + '. ' + (isGrammar ? entry.choices[id] : test.entries[id][question.type]);
    label.append(radio, text);
    $('options').append(label);
  });

  $('feedback').hidden = !run.checked;
  if (run.checked) {
    const correct = run.selected === question.correctId;
    const correctLetter = letters[question.options.indexOf(question.correctId)];
    $('verdict').textContent = correct ? 'CORRECT' : 'WRONG. It is ' + correctLetter + '.';
    $('verdict').dataset.result = correct ? 'correct' : 'wrong';
    $('details').textContent = isGrammar
      ? 'Answer: ' + entry.choices[question.correctId]
      : entry.word + ' (' + entry.part + ') · ' + entry.ipa;
    $('definition').textContent = isGrammar ? entry.explanation : 'Definition: ' + entry.definition;
    $('example').hidden = !entry.example?.trim();
    $('example').textContent = $('example').hidden ? '' : 'Example: ' + entry.example;
  }

  $('check').hidden = run.checked;
  $('check').disabled = run.checked || run.selected === null;
  $('next').textContent = run.index === total - 1 ? 'See results' : 'Next';
  $('next').hidden = !run.checked;
  $('next').disabled = !run.checked;
  if (focus) (run.checked ? $('next') : $('prompt')).focus();
}

$('question').addEventListener('submit', event => {
  event.preventDefault();
  const run = sessions[unit];
  const question = run.questions[run.index];
  if (!question || run.selected === null) return;
  if (run.checked) {
    run.index++;
    run.selected = null;
    run.checked = false;
  } else {
    run.checked = true;
    if (run.selected === question.correctId) run.correct++;
    else run.missed.push(question);
  }
  render(true);
});

$('retry').addEventListener('click', () => {
  const missed = sessions[unit].missed;
  if (!missed.length) return;
  start(unit, missed);
  render(true);
});

$('restart').addEventListener('click', () => {
  start(unit);
  render(true);
});

tests.forEach((test, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = test.name;
  button.addEventListener('click', () => {
    unit = index;
    start(unit);
    render(true);
  });
  $('units').append(button);
});

start(unit);
render();
</script>
</body>
</html>
