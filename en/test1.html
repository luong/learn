<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary &amp; Grammar Quiz · Term 1</title>
<style>
:root { color-scheme: light; --ink: #202938; --blue: #345f9c; --line: #dce1e8; --page: #f2f4f8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 18px/1.5 system-ui, sans-serif; }
main { width: min(888px, calc(100% - 28px)); margin: 22px auto 40px; }
h2, p { margin: 0; }
h2 { font-size: clamp(19px, 4vw, 24px); overflow-wrap: anywhere; }
button, input { font: inherit; }
button { border: 1px solid var(--line); border-radius: 11px; background: white; color: inherit; padding: 9px 13px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"], .primary { background: var(--blue); color: white; border-color: var(--blue); }
:focus-visible { outline: 3px solid #427ac1; outline-offset: 3px; }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px #3145660a; }
.card-head, .card-body { padding: clamp(15px, 3vw, 22px); }
.card-head { border-bottom: 1px solid var(--line); }
#unit-title { color: var(--blue); font-weight: 750; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.stats div { background: var(--page); border-radius: 10px; padding: 7px 11px; }
.stats span { display: block; color: #515d70; font-size: calc(.83rem + 1px); }
.stats strong { display: block; font-size: calc(1.15rem + 1px); }
#right, #verdict[data-result="correct"] { color: #246735; }
#wrong, #verdict[data-result="wrong"] { color: #992f26; }
#instruction, #ipa { color: #515d70; margin-bottom: 4px; }
#ipa { margin-top: 4px; }
#typed { display: block; width: 100%; margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; color: inherit; }
.options { display: grid; gap: 8px; margin: 16px 0 0; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; }
.option input { margin: 0; accent-color: var(--blue); }
.option:has(input:disabled) { cursor: default; }
#feedback { background: var(--page); border-radius: 10px; margin-top: 14px; padding: 12px 14px; overflow-wrap: anywhere; }
#feedback p, #summary { margin-top: 5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
[hidden] { display: none !important; }
@media (max-width: 440px) {
  nav { gap: 5px; }
  nav button { padding-inline: 1px; font-size: clamp(.62rem, 2.7vw, .88rem); }
}

body{font-size:18px}#prompt{font-size:clamp(19px,4vw,24px)}#instruction,#ipa{font-size:16px}
body{font-size:18px}#prompt{font-size:clamp(19px,4vw,24px)}#instruction,#ipa{font-size:16px}</style>
</head>
<body>
<main>
  <nav id="units" aria-label="Select a test"></nav>
  <section class="card" aria-labelledby="unit-title">
    <div class="card-head">
      <p id="unit-title"></p>
      <div class="stats">
        <div><span>Question</span><strong id="position"></strong></div>
        <div><span>Correct</span><strong id="right"></strong></div>
        <div><span>Wrong</span><strong id="wrong"></strong></div>
      </div>
    </div>
    <div class="card-body">
      <form id="question">
        <p id="instruction"></p>
        <h2 id="prompt" tabindex="-1"></h2>
        <p id="ipa" hidden></p>
        <div id="options" class="options" role="radiogroup" aria-labelledby="instruction prompt" aria-describedby="ipa"></div>
        <input id="typed" type="text" aria-label="Type the word" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your answer" hidden>
        <div id="feedback" role="status" hidden>
          <strong id="verdict"></strong>
          <p id="details"></p>
          <p id="definition"></p>
          <p id="example" hidden></p>
        </div>
        <div class="actions">
          <button id="check" type="submit" class="primary" disabled>Check answer</button>
          <button id="next" type="submit" class="primary" hidden disabled>Next</button>
        </div>
      </form>
      <div id="finish" hidden>
        <h2 id="finish-title" tabindex="-1">Test complete</h2>
        <p id="summary"></p>
        <div class="actions">
          <button id="retry" type="button" class="primary">Retry wrong answers</button>
          
        </div>
      </div>
    </div>
  </section>
</main>

n adds another activity."}, {"prompt": "We visited the museum, had a picnic and played games. ___, before going home, we checked our bags.", "choices": ["Finally", "Firstly", "Although", "Unlike"], "explanation": "Finally introduces the last action."}, {"prompt": "We visited the museum and played games in the park. ___, it was a great day full of fun and learning.", "choices": ["To sum up", "Due to", "Although", "Unlike"], "explanation": "To sum up introduces the overall summary."}, {"prompt": "We stayed inside ___ it was raining.", "choices": ["because", "due to", "owing to", "as a result"], "explanation": "Because introduces the clause it was raining."}, {"prompt": "We stayed inside ___ the rain.", "choices": ["due to", "because", "although", "therefore"], "explanation": "Due to can introduce the noun phrase the rain."}, {"prompt": "The shop was closed. ___, we had to go to another one.", "choices": ["Therefore", "Although", "Unlike", "Due to"], "explanation": "Therefore introduces the result."}, {"prompt": "He was the oldest, ___ the leader of the group.", "choices": ["hence", "whereas", "although", "because"], "explanation": "Hence can introduce a result expressed as a noun phrase."}, {"prompt": "It was raining. ___, we still went hiking.", "choices": ["However", "As a result", "Due to", "Although"], "explanation": "However marks a contrast between the rain and the decision to hike."}, {"prompt": "She is introverted. ___, her brother is very outgoing.", "choices": ["In contrast", "As a result", "Due to", "To sum up"], "explanation": "In contrast points out a difference between the two people."}, {"prompt": "We stayed inside owing to ___.", "choices": ["the rain", "it was raining", "it rained", "it is raining"], "explanation": "Owing to takes a noun phrase here."}, {"prompt": "___ it was raining, we still went hiking.", "choices": ["Even though", "As a result", "Unlike", "Due to"], "explanation": "Even though introduces the contrasting clause."}, {"prompt": "He likes coffee. ___, I prefer tea.", "choices": ["On the other hand", "Consequently", "Owing to", "Although"], "explanation": "On the other hand introduces a contrasting preference."}, {"prompt": "___ my sister, who prefers indoor activities, I enjoy outdoor activities.", "choices": ["Compared to", "Although", "Consequently", "What’s more"], "explanation": "Compared to can introduce the noun phrase my sister."}, {"prompt": "It was raining. ___, we still went hiking.", "choices": ["Nevertheless", "Consequently", "Firstly", "In addition"], "explanation": "Nevertheless can introduce a separate contrasting statement."}, {"prompt": "The shop was closed. ___, we went to another one.", "choices": ["As a result", "In contrast", "Unlike", "Owing to"], "explanation": "As a result introduces what happened because the shop was closed."}], [{"prompt": "Cambridge University Press published this book. → This book ___ by Cambridge University Press.", "choices": ["was published", "was publishing", "was publish", "has published"], "explanation": "Use was published to keep the past simple and make the book the subject."}, {"prompt": "Tourism is expected ___ a major part of the country’s economy.", "choices": ["to become", "become", "becoming", "became"], "explanation": "Noun subject + passive reporting verb can be followed by an infinitive."}, {"prompt": "There are reported ___ a record number of accidents on the roads this year.", "choices": ["to have been", "have been", "having been", "to having been"], "explanation": "The there construction can take the perfect infinitive to have been."}, {"prompt": "It is thought ___ the new railway will provide employment opportunities for local people.", "choices": ["that", "to", "for", "as"], "explanation": "Impersonal it can be followed by a passive reporting verb and a that-clause."}, {"prompt": "Did you get Alex ___ you all the way to London?", "choices": ["to drive", "drive", "drove", "to driving"], "explanation": "Get + person + to-infinitive describes getting someone to do something."}, {"prompt": "Don’t worry. We’ll soon have your car ___ like new.", "choices": ["running", "to running", "ran", "to ran"], "explanation": "This example uses have + object + -ing to describe making something start doing something."}, {"prompt": "The car ___ at approximately 1.30 am.", "choices": ["was stolen", "was stealing", "has stole", "was steal"], "explanation": "Was stolen is a past simple passive."}, {"prompt": "This book ___ by Cambridge University Press at the moment.", "choices": ["is being published", "is being publish", "is publishing", "being published"], "explanation": "The present continuous passive uses is being plus a past participle."}, {"prompt": "The XL500 ___ with young families in mind, so there’s plenty of room in the boot.", "choices": ["was designed", "was designing", "has design", "were designed"], "explanation": "The XL500 receives the action, so use was designed."}, {"prompt": "This type of submarine ___ during the Second World War.", "choices": ["was developed", "was developing", "has develop", "were developed"], "explanation": "Was developed is the past simple passive."}, {"prompt": "We ___ by the number of people trying to leave the city for the long weekend.", "choices": ["were surprised", "was surprised", "were surprise", "have surprise"], "explanation": "The plural subject we takes were plus the past participle surprised."}, {"prompt": "All passengers ___ to present their ticket to the inspector.", "choices": ["are required", "are requiring", "is required", "are require"], "explanation": "Passengers is plural, so the passive form is are required."}, {"prompt": "Did you finally get your bike ___?", "choices": ["fixed", "fix", "to fix", "to fixing"], "explanation": "Get something done uses an object followed by a past participle."}, {"prompt": "I heard that Susie had her motorbike ___.", "choices": ["stolen", "steal", "to steal", "stole"], "explanation": "Have something done can describe an unwanted experience."}, {"prompt": "We’ll have Alex ___ us to London.", "choices": ["drive", "to drive", "drives", "drove"], "explanation": "Have someone do something takes a bare infinitive."}, {"prompt": "The guide ___ at the hotel at noon yesterday.", "choices": ["arrived", "was arrived", "was being arrived", "has been arrived"], "explanation": "Arrive is intransitive and normally has no passive form."}, {"prompt": "The new design ___ the old one.", "choices": ["resembles", "is resembled", "is resembling by", "has been resemble"], "explanation": "Stative resemble normally uses the active form."}, {"prompt": "People expect tourism to become a major part of the country’s economy. → Tourism ___ a major part of the country’s economy.", "choices": ["is expected to become", "is expected become", "is expected becoming", "expected to becoming"], "explanation": "Use a to-infinitive after is expected in this pattern."}, {"prompt": "The Road Traffic Act, ___ in 1988, regulates vehicle use on UK roads.", "choices": ["introduced", "introducing", "introduce", "to introducing"], "explanation": "The past participle introduced gives the reduced clause a passive meaning."}, {"prompt": "Someone stole the car at approximately 1.30 am. → The car ___ at approximately 1.30 am.", "choices": ["was stolen", "stole someone", "was stealing", "is being stolen"], "explanation": "The car receives the action. Was stolen keeps the past simple."}], [{"prompt": "She lives in a ___ neighborhood.", "choices": ["well-known", "well-knowing", "well-know", "good-known"], "explanation": "The compound adjective in the example is well-known."}, {"prompt": "We stayed in a ___ hotel.", "choices": ["five-star", "five-stars", "fifth-stars", "five-starring"], "explanation": "Use the singular noun star after five in this compound adjective."}, {"prompt": "She has a ___ job.", "choices": ["full-time", "full-times", "fully-time", "full-timing"], "explanation": "The compound adjective is full-time."}, {"prompt": "He bought a ___ car.", "choices": ["second-hand", "second-handedly", "second-handing", "seconds-hand"], "explanation": "The compound adjective is second-hand."}, {"prompt": "The trip lasted three days. It was a ___ trip.", "choices": ["three-day", "three-days", "three-day’s", "three-days’"], "explanation": "Use the singular noun day in three-day."}, {"prompt": "She writes with her left hand. She is a ___ writer.", "choices": ["left-handed", "left-handing", "left-handly", "left-hands"], "explanation": "Left-handed is formed with left, hand and -ed."}, {"prompt": "The guide took us to a ___ museum known all over the world.", "choices": ["world-famous", "world-famously", "world-fame", "world-famousness"], "explanation": "World-famous combines a noun with an adjective."}, {"prompt": "The outfit looks like something people wore decades ago. She’s wearing an ___ outfit.", "choices": ["old-fashioned", "old-fashioning", "old-fashions", "old-fashionedly"], "explanation": "Old-fashioned is the adjective given in the sheet."}, {"prompt": "Our guide was relaxed and friendly. She was an ___ guide.", "choices": ["easy-going", "easy-go", "easily-go", "easy-went"], "explanation": "Easy-going is the compound adjective listed in the sheet."}, {"prompt": "The children shouted and threw things. They were ___ children.", "choices": ["badly-behaved", "badly-behave", "bad-behavedly", "badly-behaves"], "explanation": "Badly-behaved combines an adverb and a past participle."}, {"prompt": "She is ___ a book right now.", "choices": ["reading", "read", "reads", "to reading"], "explanation": "Is reading is a present continuous verb form."}, {"prompt": "This is an ___ film that holds everyone’s attention.", "choices": ["interesting", "interested", "interest", "interestingly"], "explanation": "Interesting describes the film that causes the interest."}, {"prompt": "___ is my favorite sport. I go to the pool every weekend.", "choices": ["Swimming", "Swim", "Swam", "Swum"], "explanation": "Swimming names the activity and is the subject of the sentence."}, {"prompt": "He enjoys ___ in his free time.", "choices": ["painting", "to painting", "painted", "paints"], "explanation": "Painting is a gerund and the object of enjoys."}, {"prompt": "The lecture was ___, and the students lost interest.", "choices": ["boring", "bored", "bore", "boringly"], "explanation": "Boring describes the lecture as the cause of boredom."}, {"prompt": "It’s a ___ story that made everyone gasp.", "choices": ["shocking", "shocked", "shock", "shockingly"], "explanation": "Shocking describes the story that causes the reaction."}, {"prompt": "Look at the field. They are ___ right now.", "choices": ["playing", "play", "plays", "to playing"], "explanation": "The present continuous uses are plus playing."}, {"prompt": "The lecture was boring, so the students felt ___.", "choices": ["bored", "boring", "bore", "boringly"], "explanation": "Bored describes the people who experience boredom."}, {"prompt": "He wore a ___ shirt the color of a clear sky.", "choices": ["sky-blue", "sky-bluely", "sky-blueness", "skies-blue"], "explanation": "Sky-blue combines the noun sky and adjective blue."}, {"prompt": "They cast a ___ actor to play the handsome hero.", "choices": ["good-looking", "good-looked", "good-lookingly", "good-looks"], "explanation": "Good-looking combines an adjective and a present participle."}]]</script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const units = JSON.parse($('vocabulary').textContent);
const grammar = JSON.parse($('grammar').textContent);
const tests = [
  ...units.map((entries, index) => ({ name: 'VOCAB ' + (index + 1), entries })),
  ...grammar.map((entries, index) => ({ name: 'GRAMMAR ' + (index + 1), entries })),
];
const sessions = [];
const letters = 'ABCD';
// Keep closely related entries from appearing as competing answers.
const similar = [
  [], [['apparently', 'supposedly']],
  [['ridiculously expensive', 'overpriced'], ['fooled', 'fooled into']],
  [['pothole', 'potholed']],
  [['Amazing', 'Spectacular', 'Dramatic', 'Stunning', 'Breathtaking']],
];
let unit = 0;

function wordWithPart(entry) {
  const part = entry.part
    .replace(/\badjective\b/g, 'adj')
    .replace(/\badverb\b/g, 'adv')
    .replace(/\bnoun\b/g, 'n')
    .replace(/\bverb\b/g, 'v')
    .replace(/,? \(?(plural|past|passive)\)?/g, ' $1');
  return entry.word + ' (' + part + ')';
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swap]] = [copy[swap], copy[index]];
  }
  return copy;
}

const normalizeWord = value => value.normalize('NFC').trim().toLowerCase()
  .replace(/[’‘]/g, "'").replace(/\s+/g, ' ');
function buildQuestion(unitIndex, id, type) {
  if (type === 'word') return { id, type, options: [] };
  if (type === 'grammar') {
    return { id, type, correctId: 0, options: shuffle([0, 1, 2, 3]) };
  }
  const entries = units[unitIndex];
  const word = entries[id].word;
  const related = similar[unitIndex].find(group => group.includes(word)) || [];
  const candidates = entries.map((_, index) => index)
    .filter(index => index !== id && !related.includes(entries[index].word));
  return { id, type, correctId: id, options: shuffle([id, ...shuffle(candidates).slice(0, 3)]) };
}

function start(unitIndex, missed = null) {
  const ids = tests[unitIndex].entries.map((_, id) => id);
  const types = unitIndex < units.length ? ['definition', 'word'] : ['grammar'];
  const items = types.flatMap(type => shuffle(ids).map(id => ({ id, type })));
  const review = missed && [
    ...shuffle(missed.filter(q => q.type !== 'word')),
    ...shuffle(missed.filter(q => q.type === 'word')),
  ];
  sessions[unitIndex] = {
    questions: (review ?? items).map(({ id, type }) => buildQuestion(unitIndex, id, type)),
    index: 0, selected: null, checked: false, correct: 0, missed: [], review: missed !== null,
  };
}

function render(focus = false) {
  const run = sessions[unit];
  const question = run.questions[run.index];
  const test = tests[unit];
  const entry = question && test.entries[question.id];
  const total = run.questions.length;
  $('unit-title').textContent = test.name + (run.review ? ' · Review' : '');
  [...$('units').children].forEach((button, index) => button.setAttribute('aria-pressed', index === unit));
  $('position').textContent = Math.min(run.index + 1, total) + ' / ' + total;
  $('right').textContent = run.correct;
  $('wrong').textContent = run.missed.length;
  $('question').hidden = !question;
  $('finish').hidden = Boolean(question);
  if (!question) {
    $('summary').textContent = run.correct + ' of ' + total + ' correct (' + Math.round(100 * run.correct / total) + '%).';
    $('retry').hidden = run.missed.length === 0;
    $('retry').textContent = 'Retry wrong answers (' + run.missed.length + ')';
    if (focus) $('finish-title').focus();
    return;
  }

  const isGrammar = question.type === 'grammar';
  const showWord = question.type === 'definition';
  const typing = question.type === 'word';
  $('instruction').textContent = isGrammar ? 'Choose the correct answer.' : showWord ? 'Choose the correct definition.' : 'Type the word or phrase.';
  $('prompt').textContent = isGrammar ? entry.prompt : showWord ? wordWithPart(entry) : entry.definition;
  $('ipa').textContent = showWord ? entry.ipa : '';
  $('ipa').hidden = !showWord;
  $('options').hidden = typing;
  $('typed').hidden = !typing;
  $('typed').value = typing ? run.selected ?? '' : '';
  $('typed').disabled = !typing || run.checked;
  $('options').replaceChildren();

  question.options.forEach((id, index) => {
    const label = document.createElement('label');
    label.className = 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'choice';
    radio.checked = run.selected === id;
    radio.disabled = run.checked;
    radio.addEventListener('change', () => {
      run.selected = id;
      $('check').disabled = false;
    });
    const text = document.createElement('span');
    const answer = isGrammar ? entry.choices[id] : test.entries[id].definition;
    text.textContent = letters[index] + '. ' + answer;
    label.append(radio, text);
    $('options').append(label);
  });

  $('feedback').hidden = !run.checked;
  if (run.checked) {
    const correct = isCorrect(run, question);
    const correctLetter = letters[question.options.indexOf(question.correctId)];
    $('verdict').textContent = correct ? 'CORRECT' : typing ? 'WRONG.' : 'WRONG. It is ' + correctLetter + '.';
    $('verdict').dataset.result = correct ? 'correct' : 'wrong';
    $('details').textContent = isGrammar
      ? 'Answer: ' + entry.choices[question.correctId]
      : wordWithPart(entry) + ' · ' + entry.ipa;
    $('definition').textContent = isGrammar ? entry.explanation : 'Definition: ' + entry.definition;
    $('example').hidden = !entry.example?.trim();
    $('example').textContent = $('example').hidden ? '' : 'Example: ' + entry.example;
  }

  $('check').hidden = run.checked;
  $('check').disabled = run.checked || run.selected === null;
  $('next').textContent = run.index === total - 1 ? 'See results'
    : showWord && run.questions[run.index + 1].type === 'word' ? 'Start typing answers' : 'Next';
  $('next').hidden = !run.checked;
  $('next').disabled = !run.checked;
  if (focus) (run.checked ? $('next') : typing ? $('typed') : $('prompt')).focus();
}

function isCorrect(run, question) {
  if (question.type !== 'word') return run.selected === question.correctId;
  return normalizeWord(run.selected) === normalizeWord(units[unit][question.id].word);
}

$('typed').addEventListener('input', () => {
  const run = sessions[unit];
  if (run.checked) return;
  const value = $('typed').value;
  run.selected = normalizeWord(value) ? value : null;
  $('check').disabled = run.selected === null;
});

$('question').addEventListener('submit', event => {
  event.preventDefault();
  const run = sessions[unit];
  const question = run.questions[run.index];
  if (!question || run.selected === null) return;
  if (run.checked) {
    run.index++;
    run.selected = null;
    run.checked = false;
  } else {
    run.checked = true;
    if (isCorrect(run, question)) run.correct++;
    else run.missed.push(question);
  }
  render(true);
});

$('retry').addEventListener('click', () => {
  const missed = sessions[unit].missed;
  if (!missed.length) return;
  start(unit, missed);
  render(true);
});



tests.forEach((test, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = test.name;
  button.addEventListener('click', () => {
    if (index === unit) return;
    unit = index;
    start(unit);
    render(true);
  });
  $('units').append(button);
});

start(unit);
render();

</script>
</body>
