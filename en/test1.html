<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulary &amp; Grammar Quiz · Term 1</title>
<style>
:root { color-scheme: light; --ink: #202938; --blue: #345f9c; --line: #dce1e8; --page: #f2f4f8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
main { width: min(888px, calc(100% - 28px)); margin: 22px auto 40px; }
h2, p { margin: 0; }
h2 { font-size: clamp(19px, 4vw, 24px); overflow-wrap: anywhere; }
button, input { font: inherit; }
button { border: 1px solid var(--line); border-radius: 11px; background: white; color: inherit; padding: 9px 13px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
button[aria-pressed="true"], .primary { background: var(--blue); color: white; border-color: var(--blue); }
:focus-visible { outline: 3px solid #427ac1; outline-offset: 3px; }
nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 8px 24px #3145660a; }
.card-head, .card-body { padding: clamp(15px, 3vw, 22px); }
.card-head { border-bottom: 1px solid var(--line); }
#unit-title { color: var(--blue); font-weight: 750; margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.stats div { background: var(--page); border-radius: 10px; padding: 7px 11px; }
.stats span { display: block; color: #515d70; font-size: .83rem; }
.stats strong { display: block; font-size: 1.15rem; }
#right, #verdict[data-result="correct"] { color: #246735; }
#wrong, #verdict[data-result="wrong"] { color: #992f26; }
#instruction, #ipa { color: #515d70; margin-bottom: 4px; }
#ipa { margin-top: 4px; }
.options { display: grid; gap: 8px; margin: 16px 0 0; }
.option { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; }
.option input { margin: 0; accent-color: var(--blue); }
.option:has(input:disabled) { cursor: default; }
#feedback { background: var(--page); border-radius: 10px; margin-top: 14px; padding: 12px 14px; overflow-wrap: anywhere; }
#feedback p, #summary { margin-top: 5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
[hidden] { display: none !important; }
@media (max-width: 440px) {
  nav { gap: 5px; }
  nav button { padding-inline: 1px; font-size: clamp(.62rem, 2.7vw, .88rem); }
}
</style>
</head>
<body>
<main>
  <nav id="units" aria-label="Select a test"></nav>
  <section class="card" aria-labelledby="unit-title">
    <div class="card-head">
      <p id="unit-title"></p>
      <div class="stats">
        <div><span>Question</span><strong id="position"></strong></div>
        <div><span>Correct</span><strong id="right"></strong></div>
        <div><span>Wrong</span><strong id="wrong"></strong></div>
      </div>
    </div>
    <div class="card-body">
      <form id="question">
        <p id="instruction"></p>
        <h2 id="prompt" tabindex="-1"></h2>
        <p id="ipa" hidden></p>
        <div id="options" class="options" role="radiogroup" aria-labelledby="instruction prompt" aria-describedby="ipa"></div>
        <div id="feedback" role="status" hidden>
          <strong id="verdict"></strong>
          <p id="details"></p>
          <p id="definition"></p>
          <p id="example" hidden></p>
        </div>
        <div class="actions">
          <button id="check" type="submit" class="primary" disabled>Check answer</button>
          <button id="next" type="submit" class="primary" hidden disabled>Next</button>
        </div>
      </form>
      <div id="finish" hidden>
        <h2 id="finish-title" tabindex="-1">Test complete</h2>
        <p id="summary"></p>
        <div class="actions">
          <button id="retry" type="button" class="primary">Retry wrong answers</button>
          <button id="restart" type="button">Restart full test</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script id="grammar" type="application/json">[[{"prompt": "She admitted ___ on the test.", "choices": ["cheating", "to cheat", "cheat", "cheated"], "explanation": "Admit is followed by the -ing form."}, {"prompt": "I try to avoid ___ junk food.", "choices": ["eating", "to eat", "eat", "ate"], "explanation": "Avoid is followed by the -ing form."}, {"prompt": "He kept on ___ even after the meeting ended.", "choices": ["talking", "to talk", "talk", "talked"], "explanation": "Keep on is followed by the -ing form."}, {"prompt": "They postponed ___ on holiday until next month.", "choices": ["going", "to go", "go", "went"], "explanation": "Postpone is followed by the -ing form."}, {"prompt": "I suggest ___ earlier to discuss the project.", "choices": ["meeting", "to meet", "meet", "met"], "explanation": "Suggest is followed by the -ing form."}, {"prompt": "They agreed ___ at the café at 5 p.m.", "choices": ["to meet", "meeting", "meet", "met"], "explanation": "Agree is followed by the to-infinitive."}, {"prompt": "She decided ___ abroad next year.", "choices": ["to study", "studying", "study", "studied"], "explanation": "Decide is followed by the to-infinitive."}, {"prompt": "He managed ___ the project on time.", "choices": ["to finish", "finishing", "finish", "finished"], "explanation": "Manage is followed by the to-infinitive."}, {"prompt": "The guide offered ___ us around the city.", "choices": ["to show", "showing", "show", "showed"], "explanation": "Offer is followed by the to-infinitive."}, {"prompt": "My mum didn’t want me ___ the exam.", "choices": ["to take", "taking", "take", "took"], "explanation": "Want can be followed by an object and a to-infinitive."}, {"prompt": "My parents let me ___ out late on weekends.", "choices": ["stay", "to stay", "stayed", "staying"], "explanation": "Let takes an object followed by a bare infinitive."}, {"prompt": "The funny video made everyone ___.", "choices": ["laugh", "to laugh", "laughed", "laughing"], "explanation": "Active make takes an object followed by a bare infinitive."}, {"prompt": "I was made ___ in the corner.", "choices": ["to stand", "stand", "standing", "stood"], "explanation": "Passive make takes the to-infinitive."}, {"prompt": "He refused ___ the journalist’s questions.", "choices": ["to answer", "answer", "answering", "answered"], "explanation": "Refuse takes a to-infinitive."}, {"prompt": "I’m interested in ___ more about that course.", "choices": ["hearing", "hear", "to hear", "heard"], "explanation": "A verb after the preposition in takes the -ing form."}, {"prompt": "I tried ___ the door, but it was locked and I couldn’t open it.", "choices": ["to open", "open", "opened", "to opening"], "explanation": "Try + to-infinitive describes an attempt."}, {"prompt": "I couldn’t open the door, so I experimented with another key. I tried ___ a different key.", "choices": ["using", "use", "used", "to using"], "explanation": "Try + -ing describes testing a possible solution."}, {"prompt": "We took a break so we could have tea. We stopped ___ a cup of tea.", "choices": ["to have", "having", "have", "had"], "explanation": "The to-infinitive gives the purpose of stopping."}, {"prompt": "After an unsuccessful first year at university, he went on ___ a first-class degree.", "choices": ["to get", "get", "got", "to getting"], "explanation": "Go on + to-infinitive describes moving on to something different."}, {"prompt": "We went on ___ all night without changing the subject.", "choices": ["talking", "talk", "talked", "to talking"], "explanation": "Go on + -ing describes continuing an activity."}], [{"prompt": "Which sentence keeps the verb and its direct object together?", "choices": ["They built the house very quickly.", "They built very quickly the house.", "They built the very quickly house.", "They built the house very quick."], "explanation": "The manner phrase comes after the direct object here."}, {"prompt": "Hit it too ___ and you’ll break it.", "choices": ["hard", "hardly", "hardness", "harden"], "explanation": "Hard means with force here and modifies hit."}, {"prompt": "I could ___ hear the music.", "choices": ["hardly", "hard", "hardness", "harden"], "explanation": "Hardly means almost not here."}, {"prompt": "Choose the sentence with “always” immediately after the first auxiliary.", "choices": ["The house has always been popular with tourists.", "The house always has been popular with tourists.", "The house has been always popular with tourists.", "The house has been popular with tourists always."], "explanation": "Always follows the first auxiliary has in the sheet’s example."}, {"prompt": "Choose the sentence with “probably” immediately after the first auxiliary.", "choices": ["Our house will probably have been decorated by the time you get there.", "Our house probably will have been decorated by the time you get there.", "Our house will have probably been decorated by the time you get there.", "Our house will have been probably decorated by the time you get there."], "explanation": "Probably follows will, the first auxiliary."}, {"prompt": "Choose the sentence with “rarely” immediately after “am”.", "choices": ["I am rarely in the city centre.", "I rarely am in the city centre.", "Rarely I am in the city centre.", "I am in the city centre rarely."], "explanation": "The sheet puts rarely after be in this example."}, {"prompt": "Choose the sentence with “rarely” immediately before “go”.", "choices": ["I rarely go to the city centre.", "I go rarely to the city centre.", "Rarely I go to the city centre.", "I go to the city centre rarely."], "explanation": "A frequency adverb usually comes before an ordinary main verb."}, {"prompt": "We bought it as an investment. ___, all the property prices in the area fell.", "choices": ["Then", "Quite", "Hardly", "Carefully"], "explanation": "Then links the two events in time."}, {"prompt": "You must pick the glass up very ___.", "choices": ["carefully", "careful", "care", "cares"], "explanation": "C week can appear at the end of the clause."}, {"prompt": "Choose the sentence with “on Saturday” at the beginning.", "choices": ["On Saturday, I’ll see you.", "I’ll see you on Saturday.", "I’ll see you, on Saturday.", "I’ll on Saturday see you."], "explanation": "A time phrase can appear at the beginning."}, {"prompt": "Choose the wording that places the place adverb after “staying”.", "choices": ["They’re staying downstairs.", "Downstairs, they’re staying.", "They downstairs are staying.", "They’re downstairs staying."], "explanation": "Downstairs can follow the verb as a place adverb."}], [{"prompt": "___ it was late, we kept talking.", "choices": ["Although", "Due to", "In addition", "Therefore"], "explanation": "Although introduces a contrasting clause."}, {"prompt": "He likes coffee, ___ I prefer tea.", "choices": ["whereas", "due to", "on the other hand", "in comparison with"], "explanation": "Whereas joins the two contrasting clauses in this sentence."}, {"prompt": "___ my sister, I enjoy outdoor activities.", "choices": ["Unlike", "Although", "However", "Therefore"], "explanation": "Unlike introduces the noun phrase my sister."}, {"prompt": "___, we visited the museum to see an art exhibition. It was our first stop.", "choices": ["Firstly", "Finally", "To sum up", "Nevertheless"], "explanation": "Firstly introduces the first stop."}, {"prompt": "After the museum, we moved on to the park. ___, we had a picnic under the trees.", "choices": ["Then", "Although", "Unlike", "Due to"], "explanation": "Then introduces the next event."}, {"prompt": "We had a picnic under the trees. ___, we played outdoor games and took group photos.", "choices": ["In addition", "Although", "Unlike", "Due to"], "explanation": "In addition adds another activity."}, {"prompt": "We visited the museum, had a picnic and played games. ___, before going home, we checked our bags.", "choices": ["Finally", "Firstly", "Although", "Unlike"], "explanation": "Finally introduces the last action."}, the other hand introduces a contrasting preference."}, {"prompt": "___ my sister, who prefers indoor activities, I enjoy outdoor activities.", "choices": ["Compared to", "Although", "Consequently", "What’s more"], "explanation": "Compared to can introduce the noun phrase my sister."}, {"prompt": "Choose the sentence that uses “nevertheless” to contrast two complete ideas.", "choices": ["It was raining. Nevertheless, we still went hiking.", "Nevertheless it was raining, we still went hiking.", "We still went hiking nevertheless the rain.", "We still went hiking nevertheless it was raining."], "explanation": "Nevertheless can introduce a separate contrasting statement."}, {"prompt": "The shop was closed. ___, we went to another one.", "choices": ["As a result", "In contrast", "Unlike", "Owing to"], "explanation": "As a result introduces what happened because the shop was closed."}], [{"prompt": "Which is the past simple passive of “Cambridge University Press published this book”?", "choices": ["This book was published by Cambridge University Press.", "This book is published by Cambridge University Press.", "This book was publishing by Cambridge University Press.", "This book has published Cambridge University Press."], "explanation": "Use was published to keep the past simple and make the book the subject."}, {"prompt": "Tourism is expected ___ a major part of the country’s economy.", "choices": ["to become", "become", "becoming", "became"], "explanation": "Noun subject + passive reporting verb can be followed by an infinitive."}, {"prompt": "There are reported ___ a record number of accidents on the roads this year.", "choices": ["to have been", "have been", "having been", "to having been"], "explanation": "The there construction can take the perfect infinitive to have been."}, {"prompt": "It is thought ___ the new railway will provide employment opportunities for local people.", "choices": ["that", "to", "for", "as"], "explanation": "Impersonal it can be followed by a passive reporting verb and a that-clause."}, {"prompt": "Did you get Alex ___ you all the way to London?", "choices": ["to drive", "drive", "drove", "to driving"], "explanation": "Get + person + to-infinitive describes getting someone to do something."}, {"prompt": "Don’t worry. We’ll soon have your car ___ like new.", "choices": ["running", "to running", "ran", "to ran"], "explanation": "This example uses have + object + -ing to describe making something start doing something."}, {"prompt": "The car ___ at approximately 1.30 am.", "choices": ["was stolen", "was stealing", "has stole", "was steal"], "explanation": "Was stolen is a past simple passive."}, {"prompt": "This book ___ by Cambridge University Press at the moment.", "choices": ["is being published", "is being publish", "is publishing", "being published"], "explanation": "The present continuous passive uses is being plus a past participle."}, {"prompt": "The XL500 ___ with young families in mind, so there’s plenty of room in the boot.", "choices": ["was designed", "was designing", "has design", "were designed"], "explanation": "The XL500 receives the action, so use was designed."}, {"prompt": "This type of submarine ___ during the Second World War.", "choices": ["was developed", "was developing", "has develop", "were developed"], "explanation": "Was developed is the past simple passive."}, {"prompt": "We ___ by the number of people trying to leave the city for the long weekend.", "choices": ["were surprised", "was surprised", "were surprise", "have surprise"], "explanation": "The plural subject we takes were plus the past participle surprised."}, {"prompt": "All passengers ___ to present their ticket to the inspector.", "choices": ["are required", "are requiring", "is required", "are require"], "explanation": "Passengers is plural, so the passive form is are required."}, {"prompt": "Did you finally get your bike ___?", "choices": ["fixed", "fix", "to fix", "to fixing"], "explanation": "Get something done uses an object followed by a past participle."}, {"prompt": "I heard that Susie had her motorbike ___.", "choices": ["stolen", "steal", "to steal", "stole"], "explanation": "Have something done can describe an unwanted experience."}, {"prompt": "Choose the correct sentence with causative “have”.", "choices": ["We’ll have Alex drive us to London.", "We’ll have Alex to drive us to London.", "We’ll have Alex drives us to London.", "We’ll have Alex drove us to London."], "explanation": "Have someone do something takes a bare infinitive."}, {"prompt": "Choose the correct sentence about the guide’s arrival.", "choices": ["The guide arrived at the hotel.", "The guide was arrived at the hotel.", "The guide was being arrived at the hotel.", "The guide has been arrived at the hotel."], "explanation": "Arrive is intransitive and normally has no passive form."}, {"prompt": "Choose the correct sentence with “resemble”.", "choices": ["The new design resembles the old one.", "The new design is resembled the old one.", "The new design is resembling by the old one.", "The new design has been resemble the old one."], "explanation": "Stative resemble normally uses the active form."}, {"prompt": "Choose the sentence that reports what people expect about tourism.", "choices": ["Tourism is expected to become a major part of the country’s economy.", "Tourism is expected become a major part of the country’s economy.", "Tourism is expected becoming a major part of the country’s economy.", "Tourism expected to becoming a major part of the country’s economy."], "explanation": "Use a to-infinitive after is expected in this pattern."}, {"prompt": "The Road Traffic Act, ___ in 1988, regulates vehicle use on UK roads.", "choices": ["introduced", "introducing", "introduce", "to introducing"], "explanation": "The past participle introduced gives the reduced clause a passive meaning."}, {"prompt": "Choose the passive sentence that keeps the meaning of “Someone stole the car at approximately 1.30 am.”", "choices": ["The car was stolen at approximately 1.30 am.", "The car stole someone at approximately 1.30 am.", "The car was stealing at approximately 1.30 am.", "The car is being stolen at approximately 1.30 am."], "explanation": "The car receives the action. Was stolen keeps the past simple."}], [{"prompt": "She lives in a ___ neighborhood.", "choices": ["well-known", "well-knowing", "well-know", "good-known"], "explanation": "The compound adjective in the example is well-known."}, {"prompt": "We stayed in a ___ hotel.", "choices": ["five-star", "five-stars", "fifth-stars", "five-starring"], "explanation": "Use the singular noun star after five in this compound adjective."}, {"prompt": "She has a ___ job.", "choices": ["full-time", "full-times", "fully-time", "full-timing"], "explanation": "The compound adjective is full-time."}, {"prompt": "He bought a ___ car.", "choices": ["second-hand", "second-handedly", "second-handing", "seconds-hand"], "explanation": "The compound adjective is second-hand."}, {"prompt": "Choose the sentence with the correct compound adjective for a trip lasting three days.", "choices": ["It was a three-day trip.", "It was a three-days trip.", "It was a three-day’s trip.", "It was a three-days’ trip."], "explanation": "Use the singular noun day in three-day."}, {"prompt": "Choose the sentence with the correct compound adjective for a person who writes with their left hand.", "choices": ["She is a left-handed writer.", "She is a left-handing writer.", "She is a left-handly writer.", "She is a left-hands writer."], "explanation": "Left-handed is formed with left, hand and -ed."}, {"prompt": "The guide took us to a ___ museum known all over the world.", "choices": ["world-famous", "world-famously", "world-fame", "world-famousness"], "explanation": "World-famous combines a noun with an adjective."}, {"prompt": "Choose the correct compound adjective for an outfit from a style that is no longer modern.", "choices": ["old-fashioned", "old-fashioning", "old-fashions", "old-fashionedly"], "explanation": "Old-fashioned is the adjective given in the sheet."}, {"prompt": "Choose the sentence that correctly uses the compound adjective for someone relaxed and friendly.", "choices": ["She is an easy-going guide.", "She is an easy-go guide.", "She is an easily-go guide.", "She is an easy-went guide."], "explanation": "Easy-going is the compound adjective listed in the sheet."}, {"prompt": "Choose the sentence that uses the correct compound adjective for children who behaved badly.", "choices": ["They were badly-behaved children.", "They were badly-behave children.", "They were bad-behavedly children.", "They were badly-behaves children."], "explanation": "Badly-behaved combines an adverb and a past participle."}, {"prompt": "She is ___ a book right now.", "choices": ["reading", "read", "reads", "to reading"], "explanation": "Is reading is a present continuous verb form."}, {"prompt": "This is an ___ film that holds everyone’s attention.", "choices": ["interesting", "interested", "interest", "interestingly"], "explanation": "Interesting describes the film that causes the interest."}, {"prompt": "Choose the sentence with the -ing form as the subject.", "choices": ["Swimming is my favorite sport.", "My favorite sport is swimming.", "I am swimming.", "I enjoy swimming."], "explanation": "Swimming names the activity and is the subject in the first sentence."}, {"prompt": "He enjoys ___ in his free time.", "choices": ["painting", "to painting", "painted", "paints"], "explanation": "Painting is a gerund and the object of enjoys."}, {"prompt": "The lecture was ___, and the students lost interest.", "choices": ["boring", "bored", "bore", "boringly"], "explanation": "Boring describes the lecture as the cause of boredom."}, {"prompt": "It’s a ___ story that made everyone gasp.", "choices": ["shocking", "shocked", "shock", "shockingly"], "explanation": "Shocking describes the story that causes the reaction."}, {"prompt": "Choose the correct sentence about a game happening now.", "choices": ["They are playing now.", "They are play now.", "They are plays now.", "They are to playing now."], "explanation": "The present continuous uses are plus playing."}, {"prompt": "Choose the sentence that describes a person’s reaction to the boring lecture.", "choices": ["The students were bored.", "The students were boring.", "The students were bore.", "The students were boringly."], "explanation": "Bored describes the people who experience boredom."}, {"prompt": "Choose the correct compound adjective for a shirt the color of a clear sky.", "choices": ["sky-blue", "sky-bluely", "sky-blueness", "skies-blue"], "explanation": "Sky-blue combines the noun sky and adjective blue."}, {"prompt": "Choose the correct compound adjective for someone who looks attractive.", "choices": ["good-looking", "good-looked", "good-lookingly", "good-looks"], "explanation": "Good-looking combines an adjective and a present participle."}]]</script>
<script>
'use strict';

const $ = id => document.getElementById(id);
const units = JSON.parse($('vocabulary').textContent);
const grammar = JSON.parse($('grammar').textContent);
const tests = [
  ...units.map((entries, index) => ({ name: 'VOCAB ' + (index + 1), entries })),
  ...grammar.map((entries, index) => ({ name: 'GRAMMAR ' + (index + 1), entries })),
];
const sessions = [];
const letters = 'ABCD';
const types = ['definition', 'word'];
// Keep closely related entries from appearing as competing answers.
const similar = [
  [], [['apparently', 'supposedly']],
  [['ridiculously expensive', 'overpriced'], ['fooled', 'fooled into']],
  [['pothole', 'potholed']],
  [['Amazing', 'Spectacular', 'Dramatic', 'Stunning', 'Breathtaking']],
];
let unit = 0;

function wordWithPart(entry) {
  const part = entry.part
    .replace(/\badjective\b/g, 'adj')
    .replace(/\badverb\b/g, 'adv')
    .replace(/\bnoun\b/g, 'n')
    .replace(/\bverb\b/g, 'v')
    .replace(/,? \(?(plural|past|passive)\)?/g, ' $1');
  return entry.word + ' (' + part + ')';
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index--) {
    const swap = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swap]] = [copy[swap], copy[index]];
  }
  return copy;
}

function buildQuestion(unitIndex, id, type) {
  if (type === 'grammar') {
    return { id, type, correctId: 0, options: shuffle([0, 1, 2, 3]) };
  }
  const entries = units[unitIndex];
  const word = entries[id].word;
  const related = similar[unitIndex].find(group => group.includes(word)) || [];
  const candidates = entries.map((_, index) => index)
    .filter(index => index !== id && !related.includes(entries[index].word));
  return { id, type, correctId: id, options: shuffle([id, ...shuffle(candidates).slice(0, 3)]) };
}

function start(unitIndex, missed = null) {
  const questionTypes = unitIndex < units.length ? types : ['grammar'];
  const items = missed ?? tests[unitIndex].entries.flatMap((_, id) => questionTypes.map(type => ({ id, type })));
  sessions[unitIndex] = {
    questions: shuffle(items).map(({ id, type }) => buildQuestion(unitIndex, id, type)),
    index: 0, selected: null, checked: false, correct: 0, missed: [], review: missed !== null,
  };
}

function render(focus = false) {
  const run = sessions[unit];
  const question = run.questions[run.index];
  const test = tests[unit];
  const entry = question && test.entries[question.id];
  const total = run.questions.length;
  $('unit-title').textContent = test.name + (run.review ? ' · Review' : '');
  [...$('units').children].forEach((button, index) => button.setAttribute('aria-pressed', index === unit));
  $('position').textContent = Math.min(run.index + 1, total) + ' / ' + total;
  $('right').textContent = run.correct;
  $('wrong').textContent = run.missed.length;
  $('question').hidden = !question;
  $('finish').hidden = Boolean(question);
  if (!question) {
    $('summary').textContent = run.correct + ' of ' + total + ' correct (' + Math.round(100 * run.correct / total) + '%).';
    $('retry').hidden = run.missed.length === 0;
    $('retry').textContent = 'Retry wrong answers (' + run.missed.length + ')';
    if (focus) $('finish-title').focus();
    return;
  }

  const isGrammar = question.type === 'grammar';
  const showWord = question.type === 'definition';
  $('instruction').textContent = isGrammar ? 'Choose the correct answer.' : showWord ? 'Choose the correct definition.' : 'Choose the correct word.';
  $('prompt').textContent = isGrammar ? entry.prompt : showWord ? wordWithPart(entry) : entry.definition;
  $('ipa').textContent = showWord ? entry.ipa : '';
  $('ipa').hidden = !showWord;
  $('options').replaceChildren();
  question.options.forEach((id, index) => {
    const label = document.createElement('label');
    label.className = 'option';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'choice';
    radio.checked = run.selected === id;
    radio.disabled = run.checked;
    radio.addEventListener('change', () => {
      run.selected = id;
      $('check').disabled = false;
    });
    const text = document.createElement('span');
    const choice = test.entries[id];
    const answer = isGrammar ? entry.choices[id]
      : showWord ? choice.definition : wordWithPart(choice);
    text.textContent = letters[index] + '. ' + answer;
    label.append(radio, text);
    $('options').append(label);
  });

  $('feedback').hidden = !run.checked;
  if (run.checked) {
    const correct = run.selected === question.correctId;
    const correctLetter = letters[question.options.indexOf(question.correctId)];
    $('verdict').textContent = correct ? 'CORRECT' : 'WRONG. It is ' + correctLetter + '.';
    $('verdict').dataset.result = correct ? 'correct' : 'wrong';
    $('details').textContent = isGrammar
      ? 'Answer: ' + entry.choices[question.correctId]
      : wordWithPart(entry) + ' · ' + entry.ipa;
    $('definition').textContent = isGrammar ? entry.explanation : 'Definition: ' + entry.definition;
    $('example').hidden = !entry.example?.trim();
    $('example').textContent = $('example').hidden ? '' : 'Example: ' + entry.example;
  }

  $('check').hidden = run.checked;
  $('check').disabled = run.checked || run.selected === null;
  $('next').textContent = run.index === total - 1 ? 'See results' : 'Next';
  $('next').hidden = !run.checked;
  $('next').disabled = !run.checked;
  if (focus) (run.checked ? $('next') : $('prompt')).focus();
}

$('question').addEventListener('submit', event => {
  event.preventDefault();
  const run = sessions[unit];
  const question = run.questions[run.index];
  if (!question || run.selected === null) return;
  if (run.checked) {
    run.index++;
    run.selected = null;
    run.checked = false;
  } else {
    run.checked = true;
    if (run.selected === question.correctId) run.correct++;
    else run.missed.push(question);
  }
  render(true);
});

$('retry').addEventListener('click', () => {
  const missed = sessions[unit].missed;
  if (!missed.length) return;
  start(unit, missed);
  render(true);
});

$('restart').addEventListener('click', () => {
  start(unit);
  render(true);
});

tests.forEach((test, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = test.name;
  button.addEventListener('click', () => {
    unit = index;
    start(unit);
    render(true);
  });
  $('units').append(button);
});

start(unit);
render();
</script>
</body>
