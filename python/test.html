ào?**\n\n```python\ns = \"TRI_TUE_NHAN_TAO\"\nx = 9\n\nfor i in range(8, 10):\n    if i % 2 == 0:\n        x = x * 2\n    else:\n        x = x // 3\n\nprint(s[x])\n```","options":["E","U","T","R"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2025"},{"prompt":"**Sau khi sắp xếp danh sách, hàm trả về giá trị nào?**\n\n```python\ndef F(A, n):\n    for i in range(1, n):\n        x = A[i]\n        j = i - 1\n        while j >= 0 and A[j] > x:\n            A[j + 1] = A[j]\n            j -= 1\n        A[j + 1] = x\n\n    return (A[n // 2] + A[n - 1]) / 2\n\nA = [8, 6, 4, 2, 3, 5, 7]\nprint(F(A, 7))\n```","options":["6.5","5.5","3.5","8"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2025"},{"prompt":"**Kết quả in ra là gì?**\n\n```python\nS = 0\n\nfor i in range(1, 4):\n    S += i * i\n\nprint(S)\n```","options":["14","30","29","13"],"answer":0,"source":"Đề tham khảo tốt nghiệp THPT 2025"},{"prompt":"**Sau khi sắp xếp danh sách, hàm trả về giá trị nào?**\n\n```python\ndef F(A, n):\n    for i in range(1, n):\n        x = A[i]\n        j = i - 1\n        while j >= 0 and A[j] > x:\n            A[j + 1] = A[j]\n            j -= 1\n        A[j + 1] = x\n\n    return (A[0] + A[n // 2]) / 2\n\nA = [8, 6, 4, 2, 3, 5, 7]\nprint(F(A, 7))\n```","options":["3.5","5.5","6.5","2"],"answer":0,"source":"Đề tham khảo tốt nghiệp THPT 2025"},{"prompt":"**Kết quả in ra là gì?**\n\n```python\nx, a, b = 1, 4, 8\n\nwhile a < b:\n    if x < a:\n        x = x * a\n    else:\n        x = x // a\n    a += 1\n\nprint(x)\n```","options":["21","20","3","4"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2026"},{"prompt":"**Sau khi chạy chương trình, T có giá trị nào?**\n\n```python\nL = [2, 5, 4]\nk, n, T = 1, 3, 0\n\nfor i in range(n):\n    for j in range(i + 1):\n        T += k * L[j]\n    k = -k\n\nprint(T)\n```","options":["6","11","2","-6"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2026"},{"prompt":"**Với a = 4 và b = 6, chương trình dừng khi n bằng bao nhiêu?**\n\n```python\nn = 1\n\nwhile n % a != 0 and n % b != 0:\n    n += 1\n\nprint(n)\n```","options":["4","6","12","1"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2026"},{"prompt":"**Hàm F trả về giá trị nào?**\n\n```python\ndef F(A, n):\n    j = 0\n    for i in range(n):\n        if A[i] % 2 != 0:\n            if A[j] % 2 == 0:\n                A[i], A[j] = A[j], A[i]\n            j += 1\n    return A[0] + A[n - 1]\n\nA = [2, 7, 6, 1, 4, 3, 5]\nprint(F(A, 7))\n```","options":["9","7","12","5"],"answer":0,"source":"Đề chính thức tốt nghiệp THPT 2026"},{"prompt":"**Kết quả in ra là gì?**\n\n```python\nn = 10\ns = 0\nwhile n > 0:\n    s += n // 3\n    n -= 1\nprint(s)\n```","options":["15","13","14","12"],"answer":0,"source":"Đề khảo sát chất lượng học sinh lớp 12 Hà Nội năm học 2025–2026"},{"prompt":"**Kết quả của biểu thức là gì?**\n\n```python\na = [4, 2, 5, 1, 0, 7]\nprint(a[2] % 2 + a[3])\n```","options":["2","3","6","5"],"answer":0,"source":"Đề khảo sát chất lượng học sinh lớp 12 Hà Nội năm học 2025–2026"},{"prompt":"**Hàm `find` trả về giá trị nào?**\n\n```python\ndef find(a):\n    m = a[0]\n    for i in range(1, len(a)):\n        if a[i] > m:\n            m = a[i]\n    return m\n\nprint(find([-2, 20, 20, 44, 5]))\n```","options":["44","-2","20","5"],"answer":0,"source":"Đề khảo sát chất lượng học sinh lớp 12 Hà Nội năm học 2025–2026"},{"prompt":"**Kết quả in ra là gì?**\n\n```python\nx = 10\ndef func(a):\n    x = 5\n    a = a + x\n    return a\n\ny = func(x)\nprint(x, y)\n```","options":["10 15","5 15","10 10","15 15"],"answer":0,"source":"Đề thi thử tốt nghiệp THPT An Giang 2026"},{"prompt":"**Kết quả in ra là gì?**\n\n```python\ncount = 0\nfor i in range(3):\n    j = 0\n    while j < 4:\n        if i + j == 3:\n            break\n        count += 1\n        j += 1\nprint(count)\n```","options":["6","9","4","3"],"answer":0,"source":"Đề thi thử tốt nghiệp THPT An Giang 2026"},{"prompt":"**Khi tìm K = 90 trong dãy đã sắp xếp, hàm trả về chỉ số nào?**\n\n```python\ndef BinarySearch(A, K):\n    left = 0\n    right = len(A) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if A[mid] == K:\n            return mid\n        elif A[mid] < K:\n            left = mid + 1\n        else:\n            right = mid - 1\n    return -1\n\nA = [3, 7, 10, 20, 35, 48, 70, 90, 100]\nprint(BinarySearch(A, 90))\n```","options":["7","6","8","-1"],"answer":0,"source":"Đề thi thử tốt nghiệp THPT An Giang 2026"}]}];
const names=["Nhập Xuất","Biến và kiểu dữ liệu","Tính toán","Câu lệnh IF","Vòng lặp","Chuỗi","Danh sách","Hàm","THPT" ];
const letters=["A","B","C","D"];
let partIndex=0,order=[],currentOptions=[],pos=0,correctIds=new Set(),wrongIds=new Set(),choice=null,locked=false,reviewMode=false,moveTimer=null;
const el=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function md(s){let tick=String.fromCharCode(96),fence=new RegExp(tick+"{3}(?:python)?\\n?([\\s\\S]*?)"+tick+"{3}","g"),blocks=[],inline=[];let out=esc(s).replace(fence,(_,code)=>{let mark="@@BLOCK"+blocks.length+"@@";blocks.push("<pre><code>"+code.replace(/^\n|\n$/g,"")+"</code></pre>");return mark});out=out.replace(new RegExp(tick+"([^"+tick+"\n]+)"+tick,"g"),(_,code)=>{let mark="@@INLINE"+inline.length+"@@";inline.push("<code>"+code+"</code>");return mark}).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>");blocks.forEach((b,i)=>out=out.replace("@@BLOCK"+i+"@@",b));inline.forEach((c,i)=>out=out.replace("@@INLINE"+i+"@@",c));return out}
function buttons(){let box=el("groups");box.innerHTML="";DATA.forEach((part,i)=>{let b=document.createElement("button");b.className="group"+(i===partIndex?" active":"");b.type="button";b.textContent=names[i];b.setAttribute("aria-pressed",i===partIndex);b.onclick=()=>start(i);box.appendChild(b)})}
function start(i){clearTimeout(moveTimer);partIndex=i;order=shuffle(DATA[i].questions.map((_,k)=>k));pos=0;correctIds=new Set();wrongIds=new Set();choice=null;locked=false;reviewMode=false;el("area").classList.remove("hidden");el("finish").classList.remove("show");buttons();render()}
function render(){if(pos>=order.length){finish();return}let total=DATA[partIndex].questions.length,q=DATA[partIndex].questions[order[pos]];choice=null;locked=false;currentOptions=shuffle(q.options.map((_,i)=>i));el("part").textContent=names[partIndex];el("current").textContent=(pos+1)+" / "+(reviewMode?order.length:total);el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;el("question").innerHTML=(q.source?'<div class="source">'+esc(q.source)+'</div>':'')+md(q.prompt);el("feedback").className="feedback";el("feedback").innerHTML="";el("check").classList.remove("hidden");el("check").disabled=true;el("next").classList.add("hidden");let box=el("options");box.innerHTML="";currentOptions.forEach((originalIndex,i)=>{let text=q.options[originalIndex],lab=document.createElement("label");lab.className="option";lab.innerHTML='<input type="radio" name="answer" value="'+i+'"><span><b>'+letters[i]+'. </b>'+md(text)+'</span>';lab.querySelector("input").onchange=()=>{if(!locked){choice=i;box.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));lab.classList.add("selected");el("check").disabled=false}};box.appendChild(lab)})}
function nextQuestion(){clearTimeout(moveTimer);pos++;render()}
function check(){if(choice===null||locked)return;locked=true;let questionId=order[pos],q=DATA[partIndex].questions[questionId],correctChoice=currentOptions.indexOf(q.answer),opts=el("options").querySelectorAll(".option");opts.forEach((o,i)=>{o.classList.add("disabled");o.querySelector("input").disabled=true;if(i===choice&&choice!==correctChoice)o.classList.add("incorrect")});el("check").classList.add("hidden");let f=el("feedback");if(choice===correctChoice){correctIds.add(questionId);wrongIds.delete(questionId);f.className="feedback show ok";f.textContent="Đúng! Đang chuyển sang câu tiếp theo…";moveTimer=setTimeout(nextQuestion,850)}else{if(!correctIds.has(questionId))wrongIds.add(questionId);f.className="feedback show no";f.textContent="Sai.";el("next").classList.remove("hidden")}el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;updateProgress()}
function finish(){el("area").classList.add("hidden");el("finish").classList.add("show");let total=DATA[partIndex].questions.length;el("current").textContent=total+" / "+total;el("right").textContent=correctIds.size;el("wrong").textContent=wrongIds.size;el("finishMessage").textContent="Bạn đúng "+correctIds.size+" / "+total+" câu; còn "+wrongIds.size+" câu sai.";if(wrongIds.size===0){el("finishTitle").textContent="Chúc mừng! Bạn đã trả lời đúng tất cả câu hỏi! 🎉";el("reviewPrompt").classList.add("hidden")}else{el("finishTitle").textContent="Bạn đã hoàn thành phần này.";el("reviewPrompt").classList.remove("hidden")}}
function retryWrong(){if(!wrongIds.size){finish();return}clearTimeout(moveTimer);order=shuffle(Array.from(wrongIds));pos=0;reviewMode=true;el("finish").classList.remove("show");el("area").classList.remove("hidden");render()}
function stopReview(){el("reviewPrompt").classList.add("hidden");el("finishMessage").textContent="Kết quả cuối: đúng "+correctIds.size+" / "+DATA[partIndex].questions.length+" câu; còn "+wrongIds.size+" câu sai."}
el("check").onclick=check;el("next").onclick=nextQuestion;el("reviewYes").onclick=retryWrong;el("reviewNo").onclick=stopReview;buttons();start(0);

</script></body></html>
