<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Python Terminal</div><nav aria-label="Learning resources"><a href="https://luong.github.io/learn/python/test.html">Quizz</a><a href="https://luong.github.io/learn/python/book.pdf">Book</a></nav></header>
<main>
<div class="toolbar"><div class="actions"><button id="open">Open .py</button><input id="file" type="file" accept=".py,text/x-python,text/plain" hidden><button id="download">Download</button><button id="stop" disabled>Stop</button><button id="run" class="primary" disabled>Run</button></div></div>
<div class="workspace"><section class="editor-panel" aria-label="Python editor"><div class="editor-wrap"><div id="monaco" hidden></div><div id="lines" aria-hidden="true">1</div><textarea id="code" aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div><div class="editor-footer"><span>Tab: 4 spaces · Ctrl / ⌘ + Enter to run</span></div></section><section class="result-panel"><div class="panel-title"><select id="io-mode" aria-label="Input and output mode"><option value="console">Console</option><option value="predefined">Predefined input</option><option value="file">File</option></select><button id="clear">Clear</button></div><div id="batch-input-panel" class="io-panel" hidden><label id="batch-input-label" for="batch-input">Input</label><textarea id="batch-input" spellcheck="false" aria-describedby="io-description" placeholder="Enter input before running…"></textarea><p id="io-description">Read this input with input() or sys.stdin.</p></div><div id="file-output-panel" class="io-panel" hidden><label for="file-output">output.txt</label><textarea id="file-output" readonly placeholder="Write to output.txt in your Python code."></textarea></div><div id="output-label" class="io-output-label" hidden>Output</div><div id="console" tabindex="0" aria-label="Python console"><span id="output" role="log" aria-live="polite">Program output will appear here.</span><form id="console-form" hidden><input id="console-input" aria-label="Console input" autocomplete="off" autocapitalize="off" spellcheck="false" disabled><button id="send" type="submit" hidden disabled>Send</button></form></div><div id="console-help" class="console-help">Enter to send · Ctrl+C to stop · Ctrl+D for EOF</div></section></div>
<footer><span id="status" role="status"></span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
