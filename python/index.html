<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Python Terminal</div></header>
<main>
<div class="toolbar"><div class="actions"><button id="open">Open .py</button><input id="file" type="file" accept=".py,text/x-python,text/plain" hidden><button id="download">Download</button><button id="stop" disabled>Stop</button><button id="run" class="primary" disabled>Run</button></div></div>
<div class="workspace"><section class="editor-panel" aria-label="Python editor"><div class="editor-wrap"><div id="monaco" hidden></div><div id="lines" aria-hidden="true">1</div><textarea id="code" aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></section><section class="result-panel"><div class="panel-title"><select id="io-mode" aria-label="Input and output mode"><option value="console">Console</option><option value="predefined">Predefined input</option><option value="file">File</option></select><button id="clear">Clear</button></div><section id="test-panel" hidden aria-label="Test cases"><div class="test-toolbar"><span id="test-summary" role="status">Test cases</span><button id="add-case">Add test case</button></div><div id="test-cases"></div></section><div id="console" tabindex="0" aria-label="Python console"><span id="output" role="log" aria-live="polite">Program output will appear here.</span><form id="console-form" hidden><input id="console-input" aria-label="Console input" autocomplete="off" autocapitalize="off" spellcheck="false" disabled><button id="send" type="submit" hidden disabled>Send</button></form></div></section></div>
<footer><span id="status" role="status"></span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
