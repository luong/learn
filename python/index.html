<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Python Terminal</div><nav aria-label="Learning resources"><a href="https://luong.github.io/learn/python/test.html">Quizz</a><a href="https://luong.github.io/learn/python/book.pdf">Book</a></nav></header>
<main>
<div class="toolbar"><div class="file">main.py <span id="saved">Saved locally</span></div><div class="actions"><button id="open">Open .py</button><input id="file" type="file" accept=".py,text/x-python,text/plain" hidden><button id="download">Download</button><button id="stop" disabled>Stop</button><button id="run" class="primary">Run Python</button></div></div>
<div class="workspace"><section class="editor-panel" aria-label="Python editor"><div class="editor-wrap"><div id="monaco" hidden></div><div id="lines" aria-hidden="true">1</div><textarea id="code" aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div><div class="editor-footer"><span id="position">Line 1, column 1</span><span>Tab: 4 spaces · Ctrl / ⌘ + Enter to run</span></div></section><section class="result-panel"><div class="panel-title"><h2>Console</h2><button id="clear">Clear</button></div><pre id="output" role="log" aria-live="polite">Program output will appear here.</pre><div class="stdin"><form id="console-form"><label for="console-input">Console input <span>Enter to send · Ctrl+C to stop · Ctrl+D for EOF</span></label><div class="console-entry"><input id="console-input" aria-label="Console input" autocomplete="off" spellcheck="false" placeholder="Type here when the program asks for input…" disabled><button id="send" type="submit" disabled>Send</button></div></form></div></section></div>
<footer><span id="status" role="status"></span></footer>
</main>
<script src="app.js"></script>
</body>
</html>
