np.svg\" alt=\"Hình chóp S.ABC với M, N, P lần lượt trên SA, SB, SC.\">", "options": [], "statements": [{"html": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>MN</mi><mo>∥</mo><mo>(</mo><mi>ABC</mi><mo>)</mo></math>.", "answer": true}, {"html": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>MNP</mi><mo>)</mo><mo>∥</mo><mo>(</mo><mi>ABC</mi><mo>)</mo></math>.", "answer": true}, {"html": "Tam giác MNP là tam giác đều.", "answer": true}, {"html": "Một mặt phẳng <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>α</mi><mo>)</mo></math> qua M và song song với (ABC) cắt các mặt bên của hình chóp S.ABC theo các đoạn giao tuyến tạo thành một tam giác có diện tích bằng <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><msqrt><mn>3</mn></msqrt></mrow><mn>4</mn></mfrac><mspace width=\"0.2em\"/><msup><mi mathvariant=\"normal\">cm</mi><mn>2</mn></msup></math>.", "answer": false}], "verification": "Phép vị tự tâm S tỉ số 2/3 biến ABC thành MNP. MN ∥ AB, (MNP) ∥ (ABC); MNP đều cạnh 4 cm, diện tích 4√3 cm², khác 9√3/4 cm². Đáp án: Đúng, Đúng, Đúng, Sai."}], "expected": 67, "study": "<h1 class=\"study-title\">Quan hệ song song</h1><h2>A. Cách xác định một mặt phẳng</h2><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Ba điểm không thẳng hàng.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Một đường thẳng và một điểm không thuộc đường thẳng đó.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Hai đường thẳng cắt nhau.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Hai đường thẳng song song phân biệt.</article><h2>B. Vị trí tương đối của hai đường thẳng</h2><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Trùng nhau.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Cắt nhau.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Song song.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Chéo nhau.</article><h2>C. Vị trí tương đối của đường thẳng và mặt phẳng</h2><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Đường thẳng nằm trong mặt phẳng.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Đường thẳng cắt mặt phẳng.</article><article class=\"theory-item\" style=\"display:list-item;list-style-type:disc;margin-left:1.2em\">Đường thẳng song song với mặt phẳng.</article><h2>D. Xác định giao tuyến của hai mặt phẳng</h2><article class=\"theory-item\"><strong>Cách 1:</strong> Tìm hai điểm chung phân biệt của hai mặt phẳng. Giao tuyến là đường thẳng đi qua hai điểm đó.</article><article class=\"theory-item\"><strong>Cách 2 — Dựa vào quan hệ song song:</strong><ol class=\"geometry-steps\"><li>Chỉ ra hai mặt phẳng (α), (β) lần lượt chứa hai đường thẳng a, b song song.</li><li>Tìm một điểm chung M của hai mặt phẳng.</li><li>Giao tuyến là đường thẳng đi qua M và song song với a, b.</li></ol></article><h2>E. Xác định giao điểm của đường thẳng và mặt phẳng</h2><article class=\"theory-item\"><strong>Cách 1 — Trực tiếp:</strong> Tìm đường thẳng d′ nằm trong (P) và cắt d tại M. Khi đó M là giao điểm của d và (P).</article><article class=\"theory-item\"><strong>Cách 2 — Dùng mặt phẳng phụ:</strong><ol class=\"geometry-steps\"><li>Chọn mặt phẳng (Q) chứa d.</li><li>Tìm giao tuyến Δ = (P) ∩ (Q).</li><li>Tìm M = d ∩ Δ. Khi đó M là giao điểm của d và (P).</li></ol><img class=\"geometry-figure\" src=\"m/giao-diem-mat-phang-phu.jpg\" alt=\"Mặt phẳng phụ Q chứa d, cắt P theo đường d′; d và d′ cắt nhau tại M.\"></article><h2>F. Tính chất của hai đường thẳng song song</h2><article class=\"theory-item\"><strong>Tính chất 1.</strong> Trong không gian, qua một điểm không nằm trên đường thẳng cho trước, có một và chỉ một đường thẳng song song với đường thẳng đã cho.<img class=\"geometry-figure\" src=\"m/song-song-tc1.jpg\" alt=\"Qua M ngoài d có duy nhất đường thẳng d′ song song với d.\"></article><article class=\"theory-item\"><strong>Tính chất 2.</strong> Trong không gian, hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau.<img class=\"geometry-figure\" src=\"m/song-song-tc2.jpg\" alt=\"a và b phân biệt, cùng song song với c thì a song song với b.\"></article><article class=\"theory-item\"><strong>Tính chất 3 — Giao tuyến của ba mặt phẳng.</strong> Nếu ba mặt phẳng đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến ấy hoặc đồng quy hoặc song song với nhau.<img class=\"geometry-figure\" src=\"m/song-song-tc3.jpg\" alt=\"Hai trường hợp: ba giao tuyến đồng quy tại M hoặc ba giao tuyến song song.\"></article><article class=\"theory-item\"><strong>Tính chất 4.</strong><p>Nếu a <span class=\"parallel-symbol\">∥</span> (P), a ⊂ (Q) và (P) ∩ (Q) = b thì b <span class=\"parallel-symbol\">∥</span> a.</p><img class=\"geometry-figure\" style=\"width:252px\" src=\"m/giao-tuyen-song-song-cach1.jpg\" alt=\"Hai mặt phẳng P và Q cắt nhau theo giao tuyến b song song với a.\"></article><article class=\"theory-item\"><strong>Tính chất 5.</strong><p>Nếu a <span class=\"parallel-symbol\">∥</span> (P), a <span class=\"parallel-symbol\">∥</span> (Q) và (P) ∩ (Q) = b thì b <span class=\"parallel-symbol\">∥</span> a.</p><img class=\"geometry-figure\" style=\"width:252px\" src=\"m/giao-tuyen-song-song-cach2.jpg\" alt=\"Hai mặt phẳng P và Q cắt nhau theo giao tuyến b song song với a.\"></article><h2>G. Chứng minh đường thẳng song song với mặt phẳng</h2><article class=\"theory-item\">Để chứng minh d <span class=\"parallel-symbol\">∥</span> (P):<ol class=\"geometry-steps\"><li>Chỉ ra d không nằm trong (P).</li><li>Tìm đường thẳng a nằm trong (P) sao cho d <span class=\"parallel-symbol\">∥</span> a.</li><li>Kết luận d <span class=\"parallel-symbol\">∥</span> (P).</li></ol></article><h2>H. Chứng minh hai mặt phẳng song song</h2><article class=\"theory-item\">Để chứng minh hai mặt phẳng phân biệt (P), (Q) song song:<ol class=\"geometry-steps\"><li>Chọn hai đường thẳng a, b cắt nhau trong (P).</li><li>Chứng minh a <span class=\"parallel-symbol\">∥</span> (Q) và b <span class=\"parallel-symbol\">∥</span> (Q).</li><li>Kết luận (P) <span class=\"parallel-symbol\">∥</span> (Q).</li></ol></article><h2>I. Hình lăng trụ</h2><article class=\"theory-item\"><strong>Định nghĩa.</strong> Hình lăng trụ có hai đáy là hai đa giác bằng nhau nằm trong hai mặt phẳng song song; các mặt bên là những hình bình hành. Kí hiệu: A₁A₂…Aₙ.A₁′A₂′…Aₙ′.<img class=\"geometry-figure\" src=\"m/lang-tru-tam-giac.svg\" alt=\"Lăng trụ tam giác ABC.A′B′C′ với hai đáy song song, các cạnh bên song song; cạnh khuất vẽ nét đứt.\"></article><article class=\"theory-item\"><strong>Tính chất:</strong><ul class=\"geometry-steps\"><li>Hai mặt đáy song song và hai đa giác đáy bằng nhau.</li><li>Các cạnh bên song song và bằng nhau.</li><li>Các mặt bên là hình bình hành.</li></ul></article><article class=\"theory-item\"><strong>Tên gọi.</strong> Đáy là tam giác, tứ giác, ngũ giác, … thì gọi là lăng trụ tam giác, lăng trụ tứ giác, lăng trụ ngũ giác, …</article><h2>J. Định lý Menelaus</h2><article class=\"theory-item\"><p>Cho tam giác ABC. Đường thẳng không đi qua các đỉnh, cắt các đường thẳng AB, BC, CA lần lượt tại M, N, P. Khi đó:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>MA</mi><mi>MB</mi></mfrac><mo>·</mo><mfrac><mi>NB</mi><mi>NC</mi></mfrac><mo>·</mo><mfrac><mi>PC</mi><mi>PA</mi></mfrac><mo>=</mo><mn>1</mn></math></p><img class=\"geometry-figure\" src=\"m/menelaus.svg\" alt=\"Tam giác ABC, M trên AB, N trên BC, P trên phần kéo dài AC qua C; M, N, P thẳng hàng.\"></article>", "practicePending" "inline\"><mrow><msub><mi>u</mi><mi>n</mi></msub><mo>&#x0003D;</mo><msup><mi>n</mi><mrow><mi>n</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msup></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u</mi><mi>n</mi></msub><mo>&#x0003D;</mo><msup><mn>2</mn><mi>n</mi></msup></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u</mi><mi>n</mi></msub><mo>&#x0003D;</mo><msup><mn>2</mn><mrow><mi>n</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msup></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u</mi><mi>n</mi></msub><mo>&#x0003D;</mo><mn>2</mn></mrow></math>"], "answer": 1, "verification": "u_n=2*2^(n-1)=2^n."}, {"id": 60, "source": "PHT-TC16-17-TN-13", "type": "mcq", "kind": "Thực hành", "prompt": "Cho dãy số $(u_n)$ với $u_n=\\frac{-1}{n^2+1}$. Khẳng định nào sau đây là sai?", "html": "Cho dãy số <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><msub><mi>u</mi><mi>n</mi></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math> với <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u</mi><mi>n</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><mo>&#x02212;</mo><mn>1</mn></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup><mo>&#x0002B;</mo><mn>1</mn></mrow></mfrac></mrow></math>. Khẳng định nào sau đây là sai?", "options": ["$u_{n+1}=\\frac{-1}{(n+1)^2+1}$", "$u_n>u_{n+1}$", "Đây là một dãy số tăng", "Bị chặn dưới"], "optionsHtml": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>u</mi><mrow><mi>n</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mo>&#x02212;</mo><mn>1</mn></mrow><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>n</mi><mo>&#x0002B;</mo><mn>1</mn><msup><mo stretchy=\"false\">&#x00029;</mo><mn>2</mn></msup><mo>&#x0002B;</mo><mn>1</mn></mrow></mfrac></mrow></math>" n": "1/[k(k+3)] = (1/k−1/(k+3))/3; tổng vô hạn (1+1/2+1/3)/3 = 11/18."}, {"id": 79, "type": "short", "kind": "Thực hành", "source": "GHD-NC-20261118-TL-1c", "prompt": "Tính giới hạn $\\lim_{n\\to+\\infty}\\frac{n\\sin n-3n^2}{n^2}$.", "html": "Tính giới hạn <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>n</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><mo lspace=\"0em\" rspace=\"0em\">+</mo><mo lspace=\"0em\" rspace=\"0em\">∞</mo></mrow></munder><mfrac><mrow><mi>n</mi><mi>sin</mi><mi>n</mi><mo>−</mo><mn>3</mn><msup><mi>n</mi><mn>2</mn></msup></mrow><mrow><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></math>.", "options": [], "answerValue": -3, "answerDecimals": 2, "verification": "sin n/n − 3 → −3."}, {"id": 80, "type": "short", "kind": "Thực hành", "source": "GHD-NC-20261118-TL-3B", "prompt": "Tính giới hạn $\\lim_{n\\to+\\infty}(n-1)\\sqrt{\\frac{2n+2}{n^4+n^2-1}}$.", "html": "Tính giới hạn <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>n</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><mo lspace=\"0em\" rspace=\"0em\">+</mo><mo lspace=\"0em\" rspace=\"0em\">∞</mo></mrow></munder><mo stretchy=\"false\">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><msqrt><mrow><mfrac><mrow><mn>2</mn><mi>n</mi><mo>+</mo><mn>2</mn></mrow><mrow><msup><mi>n</mi><mn>4</mn></msup><mo>+</mo><msup><mi>n</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow></mfrac></mrow></msqrt></mrow></math>.", "options": [], "answerValue": 0, "answerDecimals": 2, "verification": "Bình phương biểu thức tương đương 2/n → 0; biểu thức không âm nên tiến tới 0."}, {"id": 81, "type": "mcq", "kind": "Thực hành", "source": "Tư duy Toán 11, trang 158, câu 1", "prompt": "Cho hai dãy số $(u_n)$ và $(v_n)$. Xét các mệnh đề:\nA: $\\lim_{n\\to+\\infty}u_n=a$ khi và chỉ khi $\\lim_{n\\to+\\infty}(u_n-a)=0$.\nB: Nếu $\\lim_{n\\to+\\infty}u_n=a$ và $\\lim_{n\\to+\\infty}v_n=b$ thì $\\lim_{n\\to+\\infty}\\frac{u_n}{v_n}=\\frac ab$.\nC: Nếu $\\lim_{n\\to+\\infty}u_n=0$ và $\\lim_{n\\to+\\infty}v_n=-\\infty$ thì $\\lim_{n\\to+\\infty}\\frac{u_n}{v_n}=0$.\nD: Nếu $\\lim_{n\\to+\\infty}u_n=a>0$ và $\\lim_{n\\to+\\infty}v_n=0$ với mọi $n$ thì $\\lim_{n\\to+\\infty}\\frac{u_n}{v_n}=+\\infty$.\nE: Nếu $\\lim_{n\\to+\\infty}u_n=+\\infty$ và $\\lim_{n\\to+\\infty}v_n=a>0$ thì $\\lim_{n\\to+\\infty}u_nv_n=+\\infty$.\nTrong các mệnh đề trên, có bao nhiêu mệnh đề đúng?", "html": "Cho hai dãy số <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>(</mo><msub><mi>u</mi><mi>n</mi></msub><mo>)</mo></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>(</mo><msub><mi>v</mi><mi>n</mi></msub><mo>)</mo></mrow></math>. Xét các mệnh đề:<br>A: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>=</mo><mi>a</mi></mrow></math> khi và chỉ khi <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><mo>(</mo><msub><mi>u</mi><mi>n</mi></msub><mo>−</mo><mi>a</mi><mo>)</mo><mo>=</mo><mn>0</mn></mrow></math>.<br>B: Nếu <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>=</mo><mi>a</mi></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><mi>b</mi></mrow></math> thì <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><mfrac><msub><mi>u</mi><mi>n</mi></msub><msub><mi>v</mi><mi>n</mi></msub></mfrac><mo>=</mo><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow></math>.<br>C: Nếu <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>=</mo><mn>0</mn></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mo>∞</mo></mrow></math> thì <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><mfrac><msub><mi>u</mi><mi>n</mi></msub><msub><mi>v</mi><mi>n</mi></msub></mfrac><mo>=</mo><mn>0</mn></mrow></math>.<br>D: Nếu <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>=</mo><mi>a</mi><mo>&gt;</mo><mn>0</mn></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><mn>0</mn></mrow></math> với mọi <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math> thì <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><mfrac><msub><mi>u</mi><mi>n</mi></msub><msub><mi>v</mi><mi>n</mi></msub></mfrac><mo>=</mo><mo>+</mo><mo>∞</mo></mrow></math>.<br>E: Nếu <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>=</mo><mo>+</mo><mo>∞</mo></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><mi>a</mi><mo>&gt;</mo><mn>0</mn></mrow></math> thì <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>+</mo><mo>∞</mo></mrow></munder><msub><mi>u</mi><mi>n</mi></msub><mo>·</mo><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><mo>+</mo><mo>∞</mo></mrow></math>.<br>Trong các mệnh đề trên, có bao nhiêu mệnh đề đúng?", "options": ["1", "2", "3", "4"], "optionsHtml": ["1", "2", "3", "4"], "answer": 2, "verification": "A, C, E đúng. B thiếu điều kiện b ≠ 0. D thiếu điều kiện v_n > 0; chẳng hạn u_n = 1, v_n = -1/n thì thương tiến tới -∞. Có 3 mệnh đề đúng."}, {"id": 82, "type": "truefalse", "kind": "Thực hành", "source": "Tư duy Toán 11, trang 159, câu 12", "sourceQuestion": 12, "sourcePages": [159], "prompt": "Từ độ cao 80 m, người ta thả một quả bóng cao su xuống đất. Giả sử sau mỗi lần chạm đất, quả bóng nảy lên một độ cao bằng 1/3 độ cao mà nó đạt được trước đó. Gọi h_n là độ cao quả bóng đạt được ở lần nảy lên thứ n. Các mệnh đề sau đúng hay sai?", "html": "Từ độ cao 80 m, người ta thả một quả bóng cao su xuống đất. Giả sử sau mỗi lần chạm đất, quả bóng nảy lên một độ cao bằng <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac></mrow></math> độ cao mà nó đạt được trước đó. Gọi <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h</mi><mi>n</mi></msub></mrow></math> là độ cao quả bóng đạt được ở lần nảy lên thứ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math>. Các mệnh đề sau đúng hay sai?", "options": [], "statements": [{"html": "Ở lần nảy lên đầu tiên, quả bóng đạt độ cao <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mn>80</mn><mn>3</mn></mfrac></mrow></math> m.", "answer": true}, {"html": "Độ cao đạt được ở lần nảy lên thứ <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math> được biểu diễn theo công thức <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h</mi><mi>n</mi></msub><mo>=</mo><mn>80</mn><mo>·</mo><msup><mrow><mo>(</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>)</mo></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup></mrow></math>.", "answer": false}, {"html": "Khi số lần quả bóng chạm đất đủ lớn, độ cao của quả bóng khi nảy lên sẽ giảm dần về 0.", "answer": true}, {"html": "Nếu quá trình tiếp diễn mãi thì tổng quãng đường chuyển động của quả bóng là 160 m.", "answer": true}], "verification": "a) Đúng: h₁ = 80/3 m. b) Sai: h_n = 80(1/3)^n với n ≥ 1. c) Đúng vì 0 < 1/3 < 1 nên h_n → 0. d) Đúng: tổng độ cao các lần nảy là (80/3)/(1−1/3) = 40 m; tổng quãng đường là 80 + 2×40 = 160 m."}, {"id": 83, "type": "truefalse", "kind": "Thực hành", "source": "Tư duy Toán 11, trang 159, câu 14", "sourceQuestion": 14, "sourcePages": [159], "prompt": "Hiện tại, lượng khí thải trực tiếp ra môi trường của một nhà máy là 500 m³ trên tháng. Nhà máy dự định mỗi tháng sẽ giảm lượng khí thải đi 2% so với tháng trước đó. Các mệnh đề sau đúng hay sai?", "html": "Hiện tại, lượng khí thải trực tiếp ra môi trường của một nhà máy là 500 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><msup><mi>m</mi><mn>3</mn></msup></math> trên tháng. Nhà máy dự định mỗi tháng sẽ giảm lượng khí thải đi 2% so với tháng trước đó. Các mệnh đề sau đúng hay sai?", "options": [], "statements": [{"html": "Lượng khí thải trong tháng thứ ba kể từ khi thực hiện kế hoạch là khoảng 470 <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><msup><mi>m</mi><mn>3</mn></msup></math> (kết quả làm tròn đến hàng đơn vị).", "answer": false}, {"html": "Kể từ tháng thứ sáu trở đi, se\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo></mrow></math>. Cần có giá trị <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy=\"false\">&#x00029;</mo></mrow></math>, giới hạn tồn tại và hai giá trị bằng nhau.</article><article class=\"theory-item\">Với hàm nhiều công thức, kiểm tra: <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><msubsup><mi>x</mi><mn>0</mn><mo lspace=\"0em\" rspace=\"0em\">−</mo></msubsup></mrow></munder><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><msubsup><mi>x</mi><mn>0</mn><mo lspace=\"0em\" rspace=\"0em\">+</mo></msubsup></mrow></munder><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo></mrow></math>. Không bằng nhau thì gián đoạn.</article><h2>B. Liên tục trên khoảng, đoạn</h2><article class=\"theory-item\">Trên <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>;</mi><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>: liên tục tại mọi điểm thuộc khoảng.</article><article class=\"theory-item\">Trên <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[</mo><mi>a</mi><mi>;</mi><mi>b</mi><mo stretchy=\"false\">]</mo></mrow></math>: liên tục trên <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mi>;</mi><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo></mrow></math>, thêm <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><msup><mi>a</mi><mo lspace=\"0em\" rspace=\"0em\">+</mo></msup></mrow></munder><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><mi>a</mi><mo stretchy=\"false\">)</mo></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>x</mi><mo lspace=\"0em\" rspace=\"0em\">→</mo><msup><mi>b</mi><mo lspace=\"0em\" rspace=\"0em\">−</mo></msup></mrow></munder><mi>f</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>f</mi><mo stretchy=\"false\">(</mo><mi>b</mi><mo stretchy=\"false\">)</mo></mrow></math>.</article><h2>C. Hàm thường gặp</h2><article class=\"theory-item\">Đa thức liên tục trên R. Phân thức, căn thức và các hàm lượng giác cơ bản liên tục trên tập xác định của chúng.</article><article class=\"theory-item\">Tổng, hiệu, tích của các hàm liên tục vẫn liên tục. Với thương, mẫu phải khác 0 tại điểm xét.</article><h2>D. Chứng minh phương trình có nghiệm</h2><article class=\"theory-item\">Nếu <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi></mrow></math> liên tục trên <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[</mo><mi>a</mi><mi>;</mi><mi>b</mi><mo stretchy=\"false\">]</mo></mrow></math> và <math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>a</mi><mo stretchy=\"false\">&#x00029;</mo><mi>f</mi><mo stretchy=\"false\">&#x00028;</mo><mi>b</mi><mo stretchy=\"false\">&#x00029;</mo><mo>&#x0003C;</mo><mn>0</mn></mrow></math> thì phương trình <math xmlns=\"http://www.w3.org/1998/M  else ok=(q.acceptedAnswers||[q.answer]).includes(currentOptions[choice]);
 locked=true;el('options').querySelectorAll('input').forEach(input=>input.disabled=true);el('check').classList.add('hidden');
 if(ok){correctIds.add(id);wrongIds.delete(id);el('feedback').className='feedback show ok';el('feedback').textContent='Đúng! Đang chuyển sang câu tiếp theo…';moveTimer=setTimeout(next,q.type==='truefalse'?1800:850)}else{correctIds.delete(id);wrongIds.add(id);el('feedback').className='feedback show no';el('feedback').textContent=q.type==='truefalse'?'Có ý trả lời sai.':'Sai.';el('next').classList.remove('hidden');el('next').focus()}stats()
}

function finish(){el('area').classList.add('hidden');el('finish').classList.add('show');stats();el('finishTitle').textContent=wrongIds.size?'Bạn đã hoàn thành phần này.':'Chúc mừng! Bạn đã trả lời đúng tất cả câu hỏi! 🎉';el('score').textContent='Đúng '+correctIds.size+' / '+DATA[partIndex].questions.filter(q=>!q.issue||q.type==='truefalse').length+' câu có thể chấm; còn '+wrongIds.size+' câu sai.';el('finishMessage').textContent='';el('reviewPrompt').classList.toggle('hidden',wrongIds.size===0)}
let studying=false;el('studyToggle').onclick=e=>{e.preventDefault();if(DATA[partIndex].practicePending)return;studying=!studying;el('quiz').classList.toggle('hidden',studying);el('study').classList.toggle('hidden',!studying);el('studyToggle').textContent=studying?'Bắt đầu làm bài':'Học lý thuyết';el('studyToggle').href=studying?'#lam-bai':'#ly-thuyet'};function showTheory(i){start(i);studying=true;el('quiz').classList.add('hidden');el('study').classList.remove('hidden');el('studyToggle').textContent='Bắt đầu làm bài';el('studyToggle').href='#lam-bai';el('studyToggle').classList.toggle('hidden',!!DATA[i].practicePending)}el('topic').onchange=e=>{const i=Number(e.target.value);if(i!==partIndex)showTheory(i)};el('form').onsubmit=check;el('next').onclick=next;el('reviewYes').onclick=()=>{order=groupOrder([...wrongIds]);pos=0;reviewMode=true;el('finish').classList.remove('show');el('area').classList.remove('hidden');render()};
const stateKey='math11-view-v1';
function topicSignature(i){return DATA[i].questions.map(q=>q.source||q.prompt).join('|')}
function saveView(){try{localStorage.setItem(stateKey,JSON.stringify({topic:DATA[partIndex].title,signature:topicSignature(partIndex),studying,quickMode,scroll:window.scrollY,order,pos,correct:[...correctIds],wrong:[...wrongIds],choice,locked,currentOptions,reviewMode,quickChoices:[...document.querySelectorAll('.quick-dropdown')].map(d=>d.dataset.choice??null)}))}catch{}}
function restoreView(){
 try{
  const v=JSON.parse(localStorage.getItem(stateKey)||'null');if(!v)return false;

}

</script><script>
// Persist each test independently, including unfinished answers.
(()=>{
 const key='quiz-progress-v2:'+location.pathname;

 let restoring=false,active=null;

 const index=()=>partIndex,count=()=>DATA.length,sig=()=>signature(DATA[partIndex].questions),isReview=()=>false,clearTimer=()=>clearTimeout(moveTimer);
 const capture=()=>({order,pos,correct:[...correctIds],wrong:[...wrongIds],reviewMode,currentOptions,choice,locked,studying, inputs:[...document.querySelectorAll('#options input')].map(x=>({value:x.value,checked:x.checked}))});
 function restore(v){
  clearTimeout(moveTimer);order=v.order;pos=v.pos;correctIds=new Set(v.correct);wrongIds=new Set(v.wrong);reviewMode=v.reviewMode;
  document.getElementById('finish').classList.remove('show');document.getElementById('area').classList.remove('hidden');render(v.currentOptions);

   if(v.locked){check({preventDefault(){}}); clearTimeout(moveTimer);document.getElementById('next').classList.remove('hidden');if(correctIds.has(order[pos]))document.getElementById('feedback').textContent='Đúng!'}
  }
  studying=v.studying;el('quiz').classList.toggle('hidden',studying);el('study').classList.toggle('hidden',!studying);el('studyToggle').textContent=studying?'Bắt đầu làm bài':'Học lý thuyết';
 }
 const fresh=()=>{start(partIndex);};
 const initial=i=>{start(i);el('topic').value=String(i);el('quiz').classList.toggle('hidden',studying);el('study').classList.toggle('hidden',!studying)};

 function save(){if(restoring||active===null)return;try{store.tests[active]={signature:sig(),state:capture()};store.last=index();localStorage.setItem(key,JSON.stringify(store))}catch{}}
 const originalStart=start;
 start=function(...args){
  if(active===String(index()))save();const review=isReview(args);restoring=true;try{originalStart(...args)}finally{restoring=false}active=String(index());
  const saved=store.tests[active];

   restoring=true;try{restore(saved.state)}catch{delete store.tests[active]}finally{restoring=false}
  }

 };
 const originalRender=render;

 const reset=document.createElement('button');reset.type='button';reset.textContent='Làm lại';reset.className='action';reset.id='resetTest';reset.style.cssText='display:block;margin:16px auto';

 el('quiz').append(reset);
 document.addEventListener('click',save,true);
 for(const event of ['input','change','click','submit'])document.addEventListener(event,()=>queueMicrotask(save));

 const target=Number.isInteger(store.last)&&store.last>=0&&store.last<count()?store.last:index();
 active=null;initial(target);active=String(index());save();
})();

 const q=DATA[partIndex].questions[order[pos]];if(!q)return;
