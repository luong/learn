ùng nhau.</article><article class=\"theory-item\">Cắt nhau.</article><article class=\"theory-item\">Song song.</article><article class=\"theory-item\">Chéo nhau.</article><h2>C. Vị trí tương đối của đường thẳng và mặt phẳng</h2><article class=\"theory-item\">Đường thẳng nằm trong mặt phẳng.</article><article class=\"theory-item\">Đường thẳng cắt mặt phẳng.</article><article class=\"theory-item\">Đường thẳng song song với mặt phẳng.</article><h2>D. Xác định giao tuyến của hai mặt phẳng</h2><article class=\"theory-item\"><strong>Cách 1:</strong> Tìm hai điểm chung phân biệt của hai mặt phẳng. Giao tuyến là đường thẳng đi qua hai điểm đó.</article><article class=\"theory-item\"><strong>Cách 2 — Dựa vào quan hệ song song:</strong><ol class=\"geometry-steps\"><li>Chỉ ra hai mặt phẳng (α), (β) lần lượt chứa hai đường thẳng a, b song song.</li><li>Tìm một điểm chung M của hai mặt phẳng.</li><li>Giao tuyến là đường thẳng đi qua M và song song với a, b.</li></ol></article><h2>E. Xác định giao điểm của đường thẳng và mặt phẳng</h2><article class=\"theory-item\"><strong>Cách 1 — Trực tiếp:</strong> Tìm đường thẳng d′ nằm trong (P) và cắt d tại M. Khi đó M là giao điểm của d và (P).</article><article class=\"theory-item\"><strong>Cách 2 — Dùng mặt phẳng phụ:</strong><ol class=\"geometry-steps\"><li>Chọn mặt phẳng (Q) chứa d.</li><li>Tìm giao tuyến Δ = (P) ∩ (Q).</li><li>Tìm M = d ∩ Δ. Khi đó M là giao điểm của d và (P).</li></ol><img class=\"geometry-figure\" src=\"m/giao-diem-mat-phang-phu.jpg\" alt=\"Mặt phẳng phụ Q chứa d, cắt P theo đường d′; d và d′ cắt nhau tại M.\"></article><h2>F. Tính chất của hai đường thẳng song song</h2><article class=\"theory-item\"><strong>Tính chất 1.</strong> Trong không gian, qua một điểm không nằm trên đường thẳng cho trước, có một và chỉ một đường thẳng song song với đường thẳng đã cho.<img class=\"geometry-figure\" src=\"m/song-song-tc1.jpg\" alt=\"Qua M ngoài d có duy nhất đường thẳng d′ song song với d.\"></article><article class=\"theory-item\"><strong>Tính chất 2.</strong> Trong không gian, hai đường thẳng phân biệt cùng song song với đường thẳng thứ ba thì song song với nhau.<img class=\"geometry-figure\" src=\"m/song-song-tc2.jpg\" alt=\"a và b phân biệt, cùng song song với c thì a song song với b.\"></article><article class=\"theory-item\"><strong>Tính chất 3 — Giao tuyến của ba mặt phẳng.</strong> Nếu ba mặt phẳng đôi một cắt nhau theo ba giao tuyến phân biệt thì ba giao tuyến ấy hoặc đồng quy hoặc song song với nhau.<img class=\"geometry-figure\" src=\"m/song-song-tc3.jpg\" alt=\"Hai trường hợp: ba giao tuyến đồng quy tại M hoặc ba giao tuyến song song.\"></article><article class=\"theory-item\"><strong>Tính chất 4.</strong><p>Nếu a ∥ (P), a ⊂ (Q) và (P) ∩ (Q) = b thì b ∥ a.</p><img class=\"geometry-figure\" style=\"width:252px\" src=\"m/giao-tuyen-song-song-cach1.jpg\" alt=\"Hai mặt phẳng P và Q cắt nhau theo giao tuyến b song song với a.\"></article><article class=\"theory-item\"><strong>Tính chất 5.</strong><p>Nếu a ∥ (P), a ∥ (Q) và (P) ∩ (Q) = b thì b ∥ a.</p><img class=\"geometry-figure\" style=\"width:252px\" src=\"m/giao-tuyen-song-song-cach2.jpg\" alt=\"Hai mặt phẳng P và Q cắt nhau theo giao tuyến b song song với a.\"></article><h2>G. Chứng minh đường thẳng song song với mặt phẳng</h2><article class=\"theory-item\">Để chứng minh d ∥ (P):<ol class=\"geometry-steps\"><li>Chỉ ra d không nằm trong (P).</li><li>Tìm đường thẳng a nằm trong (P) sao cho d ∥ a.</li><li>Kết luận d ∥ (P).</li></ol></article><h2>H. Chứng minh hai mặt phẳng song song</h2><article class=\"theory-item\">Để chứng minh hai mặt phẳng phân biệt (P), (Q) song song:<ol class=\"geometry-steps\"><li>Chọn hai đường thẳng a, b cắt nhau trong (P).</li><li>Chứng minh a ∥ (Q) và b ∥ (Q).</li><li>Kết luận (P) ∥ (Q).</li></ol></article><h2>I. Hình lăng trụ</h2><article class=\"theory-item\"><strong>Định nghĩa.</strong> Hình lăng trụ có hai đáy là hai đa giác bằng nhau nằm trong hai mặt phẳng song song; các mặt bên là những hình bình hành. Kí hiệu: A₁A₂…Aₙ.A₁′A₂′…Aₙ′.<img class=\"geometry-figure\" src=\"m/lang-tru-tam-giac.svg\" alt=\"Lăng trụ tam giác ABC.A′B′C′ với hai đáy song song, các cạnh bên song song; cạnh khuất vẽ nét đứt.\"></article><article class=\"theory-item\"><strong>Tính chất:</strong><ul class=\"geometry-steps\"><li>Hai mặt đáy song song và hai đa giác đáy bằng nhau.</li><li>Các cạnh bên song song và bằng nhau.</li><li>Các mặt bên là hình bình hành.</li></ul></article><article class=\"theory-item\"><strong>Tên gọi.</strong> Đáy là tam giác, tứ giác, ngũ giác, … thì gọi là lăng trụ tam giác, lăng trụ tứ giác, lăng trụ ngũ giác, …</article>", "practicePending": true}, {"title": "Giới hạn dãy số", "expected": 29, "questions": [{"id": 1, "prompt": "Tính giới hạn: lim 1/n", "answer": 0, "kind": "Thực hành", "options": ["0", "1", "+∞", "−∞"], "html": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" displaystyle=\"true\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>n</mi><mo lspace=\"0em\" rspace=\"0em\">&#x02192;</mo><mo lspace=\"0em\" rspace=\"0em\">&#x0002B;</mo><mo lspace=\"0em\" rspace=\"0em\">&#x0221E;</mo></mrow></munder><mfrac><mn>1</mn><mi>n</mi></mfrac></mrow></math>", "optionsHtml": ["<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0</mn></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x0002B;</mo><mo>&#x0221E;</mo></mrow></math>", "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>&#x02212;</mo><mo>&#x0221E;</mo></mrow></math>"]}, {"id": 2, "prompt": "Tính giới hạn: lim 5/n³", "answer": 0, "kind": "Thực hành", "options": ["0", "1", "+∞", "−∞"], "html": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\" displaystyle=\"true\"><mrow><munder><mo movablelimits=\"false\">lim</mo><mrow><mi>n</mi><mo lspace=\"0 const el=id=>document.getElementById(id);
let partIndex=0,order=[],pos=0,correctIds=new Set(),wrongIds=new Set(),locked=false,reviewMode=false,moveTimer,choice=null,currentOptions=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function groupOrder(ids){const topic=DATA[partIndex],questions=topic.questions;if(topic.orderedExercises)return ids.slice().sort((a,b)=>questions[a].id-questions[b].id);return [...shuffle(ids.filter(id=>questions[id].kind==='Lý thuyết')),...shuffle(ids.filter(id=>questions[id].kind==='Thực hành'))]}
function stats(){el('right').textContent=correctIds.size;el('wrong').textContent=wrongIds.size}
let quickMode=false;
function renderStudy(){
 const topic=DATA[partIndex],box=el('studyContent');
 const study=topic.study.replace(/<h1\b[^>]*>.*?<\/h1>/g,'');
 if(!topic.theoryQuestions){box.innerHTML=study;return}
 const heading='<div class="study-heading"><a href="#kiem-tra-nhanh" id="quickToggle" aria-pressed="'+quickMode+'">'+(quickMode?'Xem lý thuyết':'Kiểm tra nhanh')+'</a></div>';
 if(!quickMode){box.innerHTML=heading+study}
 else{
  box.innerHTML=heading;let section='';
  (topic.theoryQuestions||topic.questions).forEach((q,index)=>{
   if(q.section&&q.section!==section){section=q.section;const h=document.createElement('h2');h.textContent=section;box.append(h)}
   const row=document.createElement('article');row.className='theory-item quick-item';
   const prompt=document.createElement('div');prompt.className='quick-prompt';prompt.innerHTML=q.html.replaceAll('display="block"','display="inline"');
   const controls=document.createElement('div');controls.className='quick-controls';
   const dropdown=document.createElement('details');dropdown.className='quick-dropdown';
   const selected=document.createElement('summary');selected.textContent='Chọn đáp án';selected.setAttribute('aria-label','Chọn đáp án câu '+(index+1));dropdown.append(selected);
   const menu=document.createElement('div');menu.className='quick-menu';
   const status=document.createElement('span');status.className='quick-status';status.setAttribute('role','status');status.setAttribute('aria-live','polite');
   shuffle(q.options.map((_,i)=>i)).forEach(original=>{
    const option=document.createElement('button');option.type='button';option.className='quick-option';option.dataset.optionIndex=String(original);option.innerHTML=q.optionsHtml[original];
    option.onclick=()=>{dropdown.dataset.choice=String(original);selected.innerHTML=q.optionsHtml[original];dropdown.open=false;const ok=original===q.answer;status.textContent=ok?'✓':'⚠';status.className='quick-status '+(ok?'quick-ok':'quick-wrong');status.setAttribute('aria-label',ok?'Đúng':'Sai');status.title=ok?'Đúng':'Sai';selected.focus()};menu.append(option)
   });dropdown.append(menu);controls.append(dropdown,status);row.append(prompt,controls);box.append(row)
  })
 }
 el('quickToggle').onclick=e=>{e.preventDefault();quickMode=!quickMode;renderStudy()}
}
function start(i){clearTimeout(moveTimer);partIndex=i;order=groupOrder(DATA[i].questions.map((_,k)=>k));pos=0;correctIds=new Set();wrongIds=new Set();reviewMode=false;el('topic').value=String(i);el('studyToggle').classList.toggle('hidden',!!DATA[i].practicePending);el('part').textContent=DATA[i].title;quickMode=false;renderStudy();el('finish').classList.remove('show');el('area').classList.remove('hidden');render()}
function render(savedOptions=null){if(pos>=order.length){finish();return}locked=false;const q=DATA[partIndex].questions[order[pos]];el('part').textContent=DATA[partIndex].title;el('current').textContent=(pos+1)+' / '+order.length+(reviewMode?' (làm lại)':'');stats();el('question').innerHTML=q.html;choice=null;currentOptions=savedOptions||shuffle(q.options.map((_,i)=>i));const box=el('options');box.replaceChildren();currentOptions.forEach((original,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;const span=document.createElement('span');span.innerHTML='<b>'+ 'ABCD'[i]+'. </b>'+q.optionsHtml[original];input.onchange=()=>{if(locked)return;choice=i;box.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected');el('check').disabled=false};label.append(input,span);box.append(label)});el('check').disabled=true;el('check').classList.remove('hidden');el('next').classList.add('hidden');el('feedback').className='feedback';el('feedback').textContent=''}
function next(){clearTimeout(moveTimer);pos++;render()}
function check(e){e.preventDefault();if(locked||choice===null)return;locked=true;const id=order[pos],q=DATA[partIndex].questions[id],ok=currentOptions[choice]===q.answer;el('options').querySelectorAll('input').forEach(input=>input.disabled=true);el('check').classList.add('hidden');if(ok){correctIds.add(id);wrongIds.delete(id);el('feedback').className='feedback show ok';el('feedback').textContent='Đúng! Đang chuyển sang câu tiếp theo…';moveTimer=setTimeout(next,850)}else{wrongIds.add(id);el('feedback').className='feedback show no';el('feedback').textContent='Sai.';el('next').classList.remove('hidden');el('next').focus()}stats()}

function finish(){el('area').classList.add('hidden');el('finish').classList.add('show');stats();el('finishTitle').textContent=wrongIds.size?'Bạn đã hoàn thành phần này.':'Chúc mừng! Bạn đã trả lời đúng tất cả câu hỏi! 🎉';el('score').textContent='Đúng '+correctIds.size+' / '+DATA[partIndex].questions.length+' câu; còn '+wrongIds.size+' câu sai.';el('finishMessage').textContent='';el('reviewPrompt').classList.toggle('hidden',wrongIds.size===0)}
let studying=false;el('studyToggle').onclick=e=>{e.preventDefault();if(DATA[partIndex].practicePending)return;clearTimeout(moveTimer);studying=!studying;if(!studying)start(partIndex);el('quiz').classList.toggle('hidden',studying);el('study').classList.toggle('hidden',!studying);el('studyToggle').textContent=studying?'Bắt đầu làm bài':'Học lý thuyết';el('studyToggle').href=studying?'#lam-bai':'#ly-thuyet'};function showTheory(i){start(i);studying=true;el('quiz').classList.add('hidden');el('study').classList.remove('hidden');el('studyToggle').textContent='Bắt đầu làm bài';el('studyToggle').href='#lam-bai';el('studyToggle').classList.toggle('hidden',!!DATA[i].practicePending)}el('topic').onchange=e=>showTheory(Number(e.target.value));el('form').onsubmit=check;el('next').onclick=next;el('reviewYes').onclick=()=>{order=groupOrder([...wrongIds]);pos=0;reviewMode=true;el('finish').classList.remove('show');el('area').classList.remove('hidden');render()};el('reviewNo').onclick=()=>el('reviewPrompt').classList.add('hidden');el('restart').onclick=()=>start(partIndex);
const stateKey='math11-view-v1';
function topicSignature(i){return DATA[i].questions.map(q=>q.source||q.prompt).join('|')}
function saveView(){try{localStorage.setItem(stateKey,JSON.stringify({topic:DATA[partIndex].title,signature:topicSignature(partIndex),studying,quickMode,scroll:window.scrollY,order,pos,correct:[...correctIds],wrong:[...wrongIds],choice,locked,currentOptions,reviewMode,quickChoices:[...document.querySelectorAll('.quick-dropdown')].map(d=>d.dataset.choice??null)}))}catch{}}
function restoreView(){
 try{
  const v=JSON.parse(localStorage.getItem(stateKey)||'null');if(!v)return false;
  const i=DATA.findIndex(t=>t.title===v.topic);if(i<0||v.signature!==topicSignature(i))return false;
  const total=DATA[i].questions.length;
  if(DATA[i].practicePending){showTheory(i);requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Number(v.scroll)||0)));return true}
  if(!Array.isArray(v.order)||!v.order.length||new Set(v.order).size!==v.order.length||!v.order.every(n=>Number.isInteger(n)&&n>=0&&n<total)||!Number.isInteger(v.pos)||v.pos<0||v.pos>v.order.length)return false;
  showTheory(i);studying=!!v.studying;quickMode=!!v.quickMode;
  order=v.order;pos=v.pos;correctIds=new Set((v.correct||[]).filter(n=>Number.isInteger(n)&&n>=0&&n<total));wrongIds=new Set((v.wrong||[]).filter(n=>Number.isInteger(n)&&n>=0&&n<total));reviewMode=!!v.reviewMode;
  const q=DATA[i].questions[order[pos]],opts=v.currentOptions;
  const validOptions=q&&Array.isArray(opts)&&opts.length===q.options.length&&new Set(opts).size===opts.length&&opts.every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length);
  render(validOptions?opts:null);renderStudy();
  if(q&&validOptions&&Number.isInteger(v.choice)&&v.choice>=0&&v.choice<opts.length){el('options').querySelectorAll('input')[v.choice].click();if(v.locked)check({preventDefault(){}})}
  if(studying){clearTimeout(moveTimer);el('quiz').classList.add('hidden');el('study').classList.remove('hidden');el('studyToggle').textContent='Bắt đầu làm bài';el('studyToggle').href='#lam-bai';if(quickMode){document.querySelectorAll('.quick-dropdown').forEach((d,k)=>{const chosen=v.quickChoices?.[k];if(chosen!==null&&chosen!==undefined)d.querySelector('[data-option-index="'+chosen+'"]')?.click()})}}
  else{el('quiz').classList.remove('hidden');el('study').classList.add('hidden');el('studyToggle').textContent='Học lý thuyết';el('studyToggle').href='#ly-thuyet'}
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Number(v.scroll)||0)));return true;
 }catch{return false}
}
window.addEventListener('pagehide',saveView);window.addEventListener('beforeunload',saveView);
if(!restoreView())showTheory(0);
